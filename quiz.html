", "title": "ML & deep learning fundamentals", "questions": [{"id": "ml-fundamentals-001", "type": "mcq", "question": "Training error is low, validation error is high. Diagnosis and first fixes?", "difficulty": 1, "tags": ["bias-variance"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["Learning rate too low", "High variance (overfitting): more data, regularization, simpler model, early stopping", "High bias: add features and a bigger model", "Data leakage: nothing to fix"], "answer": 1, "explanation": "The gap between train and validation is the variance signal."}, {"id": "ml-fundamentals-002", "type": "mcq", "question": "Which regularizer tends to produce sparse weights (exact zeros)?", "difficulty": 1, "tags": ["regularization"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["Dropout", "L2 (ridge)", "Batch normalization", "L1 (lasso)"], "answer": 3, "explanation": "The L1 penalty's corner geometry drives weights to zero, so it doubles as feature selection."}, {"id": "ml-fundamentals-003", "type": "mcq", "question": "L2 regularization corresponds to which prior in a MAP view?", "difficulty": 2, "tags": ["regularization"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["Laplace prior", "Gaussian prior on the weights", "Uniform prior", "Beta prior"], "answer": 1, "explanation": "L1 ↔ Laplace prior."}, {"id": "ml-fundamentals-004", "type": "mcq", "question": "Bagging (random forest) primarily reduces ___; boosting primarily reduces ___.", "difficulty": 2, "tags": ["ensembles"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["variance; variance", "bias; variance", "bias; bias", "variance; bias"], "answer": 3, "explanation": "Averaging deep, decorrelated trees cuts variance; sequentially fitting residuals with shallow trees cuts bias."}, {"id": "ml-fundamentals-005", "type": "mcq", "question": "In gradient boosting, each new tree is fit to:", "difficulty": 2, "tags": ["ensembles"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["Random labels", "The negative gradient of the loss w.r.t. current predictions (residuals for MSE)", "The features with the highest variance", "A bootstrap sample of the original labels"], "answer": 1, "explanation": "That's why it's 'gradient' boosting: functional gradient descent."}, {"id": "ml-fundamentals-006", "type": "mcq", "question": "Which feature importance method is consistent and gives per-prediction explanations?", "difficulty": 2, "tags": ["interpretability"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["Number of splits", "Correlation with the target", "SHAP values", "Gain-based importance"], "answer": 2, "explanation": "Gain-based importance is biased toward high-cardinality features; permutation importance is global only."}, {"id": "ml-fundamentals-007", "type": "mcq", "question": "Target encoding a high-cardinality categorical feature risks:", "difficulty": 2, "tags": ["features"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["Vanishing gradients", "Label leakage, unless computed out-of-fold with smoothing", "Too many columns", "Nothing"], "answer": 1, "explanation": "Each row's own label leaks into its feature; use K-fold encoding and smoothing toward the prior."}, {"id": "ml-fundamentals-008", "type": "mcq", "question": "Which model does NOT need feature scaling?", "difficulty": 1, "tags": ["features"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["Logistic regression with L2 regularization", "k-NN", "SVM with RBF kernel", "Decision trees / gradient-boosted trees"], "answer": 3, "explanation": "Trees split on thresholds, so scale doesn't matter; distance- and penalty-based models care."}, {"id": "ml-fundamentals-009", "type": "mcq", "question": "k-means assumes clusters are roughly:", "difficulty": 2, "tags": ["unsupervised"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["Arbitrarily shaped", "Defined by density", "Spherical and similar in size (it minimizes squared Euclidean distance)", "Hierarchical"], "answer": 2, "explanation": "Use DBSCAN or Gaussian mixtures for other shapes; k-means++ for initialization."}, {"id": "ml-fundamentals-010", "type": "mcq", "question": "PCA finds:", "difficulty": 1, "tags": ["unsupervised"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["Clusters in the data", "Features most correlated with the label", "Orthogonal directions of maximum variance (top eigenvectors of the covariance matrix)", "Non-linear manifolds"], "answer": 2, "explanation": "Unsupervised, linear; computed via SVD of centered data."}, {"id": "ml-fundamentals-011", "type": "mcq", "question": "Cross-validation for data where the same user appears in many rows should use:", "difficulty": 2, "tags": ["validation"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["No validation", "Leave-one-out", "Grouped k-fold (all of a user's rows in the same fold)", "Plain random k-fold"], "answer": 2, "explanation": "Otherwise the model memorizes users and validation is optimistic."}, {"id": "ml-fundamentals-012", "type": "mcq", "question": "Logistic regression coefficient w for feature x means:", "difficulty": 2, "tags": ["linear-models"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["x causes the outcome", "A one-unit increase in x multiplies the odds by e^w", "A one-unit increase in x increases probability by w", "x's importance rank"], "answer": 1, "explanation": "Coefficients are in log-odds space."}, {"id": "ml-fundamentals-013", "type": "mcq", "question": "Which loss is most robust to outliers in regression?", "difficulty": 1, "tags": ["losses"], "ref": "05-ml-fundamentals/classical-ml.md", "options": ["MSE", "Hinge loss", "Log loss", "MAE (or Huber)"], "answer": 3, "explanation": "MSE squares errors, so outliers dominate; Huber is quadratic near 0 and linear in the tails."}, {"id": "ml-fundamentals-014", "type": "mcq", "question": "Residual (skip) connections mainly help by:", "difficulty": 1, "tags": ["deep-learning"], "ref": "05-ml-fundamentals/deep-learning.md", "options": ["Acting as dropout", "Normalizing activations", "Letting gradients flow directly through many layers, which eases optimization of deep networks", "Reducing the number of parameters"], "answer": 2, "explanation": "y = x + F(x): the identity path keeps gradients from vanishing."}, {"id": "ml-fundamentals-015", "type": "mcq", "question": "AdamW differs from Adam with L2 by:", "difficulty": 2, "tags": ["optimization"], "ref": "05-ml-fundamentals/deep-learning.md", "options": ["Removing bias correction", "Decoupling weight decay from the adaptive gradient update", "Using SGD after warmup", "Using no momentum"], "answer": 1, "explanation": "With Adam, L2 in the loss gets scaled by adaptive rates; decoupled decay behaves like true weight decay."}, {"id": "ml-fundamentals-016", "type": "mcq", "question": "Why use LR warmup when training transformers?", "difficulty": 2, "tags": ["optimization"], "ref": "05-ml-fundamentals/deep-learning.md", "options": ["Early Adam updates with poorly estimated second moments can be unstable; warmup ramps the LR up safely", "To save memory", "To initialize embeddings", "To shuffle data"], "answer": 0, "explanation": "Typically followed by cosine or linear decay."}, {"id": "ml-fundamentals-017", "type": "mcq", "question": "Why do transformers use LayerNorm/RMSNorm rather than BatchNorm?", "difficulty": 2, "tags": ["deep-learning"], "ref": "05-ml-fundamentals/deep-learning.md", "options": ["LayerNorm adds more parameters", "BatchNorm only works for regression", "Normalization is per example, so it's independent of batch size and sequence padding, and identical in train and inference", "BatchNorm can't be implemented on GPUs"], "answer": 2, "explanation": "BatchNorm statistics are noisy for small/variable batches and sequences."}, {"id": "ml-fundamentals-018", "type": "mcq", "question": "A bi-encoder vs a cross-encoder for search:", "difficulty": 1, "tags": ["embeddings"], "ref": "05-ml-fundamentals/deep-learning.md", "options": ["Bi-encoders embed query and docs separately (precomputable, fast); cross-encoders score pairs jointly (accurate, slow)", "They're identical", "Bi-encoders can't be used for retrieval", "Cross-encoders are faster"], "answer": 0, "explanation": "Use bi-encoders to retrieve and cross-encoders to re-rank."}, {"id": "ml-fundamentals-019", "type": "mcq", "question": "In contrastive learning with in-batch negatives, increasing batch size typically:", "difficulty": 2, "tags": ["embeddings"], "ref": "05-ml-fundamentals/deep-learning.md", "options": ["Removes the need for positives", "Makes the loss non-differentiable", "Improves embeddings by providing more negatives per positive", "Has no effect"], "answer": 2, "explanation": "Hard negatives help further."}, {"id": "ml-fundamentals-020", "type": "mcq", "question": "Your network's loss is NaN after a few steps. First things to check?", "difficulty": 1, "tags": ["debugging"], "ref": "05-ml-fundamentals/deep-learning.md", "options": ["Remove the validation set", "Increase the batch size to 10×", "Add more layers", "Learning rate too high, log(0) or division by zero, fp16 overflow; try gradient clipping"], "answer": 3, "explanation": "Also check inputs for NaN/inf and verify the data pipeline."}, {"id": "ml-fundamentals-021", "type": "mcq", "question": "Approximate memory to train a model with Adam in mixed precision, per parameter (excluding activations)?", "difficulty": 3, "tags": ["training-at-scale"], "ref": "05-ml-fundamentals/deep-learning.md", "options": ["~16–20 bytes", "~100 bytes", "~2 bytes", "~4 bytes"], "answer": 0, "explanation": "fp16/bf16 weights (2) + gradients (2) + fp32 master weights (4) + Adam moments (4 + 4) = 16, plus overhead."}, {"id": "ml-fundamentals-022", "type": "mcq", "question": "FSDP / ZeRO stage 3 shards:", "difficulty": 3, "tags": ["training-at-scale"], "ref": "05-ml-fundamentals/deep-learning.md", "options": ["Parameters, gradients, and optimizer states across data-parallel workers", "Only activations", "Only the dataset", "Only the learning rate schedule"], "answer": 0, "explanation": "Reduces per-GPU memory so larger models fit, at the cost of extra communication."}, {"id": "ml-fundamentals-023", "type": "mcq", "question": "Mixture-of-Experts models:", "difficulty": 2, "tags": ["architectures"], "ref": "05-ml-fundamentals/deep-learning.md", "options": ["Route each token to a few expert MLPs, increasing total parameters without proportionally increasing compute per token", "Average the predictions of many separately trained models", "Use one expert per layer always", "Require no routing"], "answer": 0, "explanation": "Challenges: load balancing, memory (all experts resident), communication."}, {"id": "ml-fundamentals-024", "type": "card", "question": "Explain the bias–variance decomposition in one breath.", "difficulty": 1, "tags": ["bias-variance"], "ref": "05-ml-fundamentals/classical-ml.md", "answer": "Expected test error = bias² (error from wrong assumptions) + variance (sensitivity to the training sample) + irreducible noise. Simple models: high bias. Complex models: high variance. Regularization, more data, and ensembling move you along the trade-off."}, {"id": "ml-fundamentals-025", "type": "card", "question": "How do you handle class imbalance?", "difficulty": 1, "tags": ["imbalance"], "ref": "05-ml-fundamentals/classical-ml.md", "answer": "Use the right metric (PR-AUC, recall at precision); class weights or focal loss; resample (down-sample negatives, then recalibrate); tune the decision threshold for the business cost; collect more positives. SMOTE rarely helps in production."}, {"id": "ml-fundamentals-026", "type": "card", "question": "What is data leakage? Give two examples.", "difficulty": 1, "tags": ["data"], "ref": "05-ml-fundamentals/classical-ml.md", "answer": "Information unavailable at prediction time leaking into training. Examples: a feature computed after the label event (e.g. 'account closed date' for churn); random splits for time series; target encoding without out-of-fold; normalizing with statistics from the full dataset including test."}, {"id": "ml-fundamentals-027", "type": "card", "question": "Platt scaling vs isotonic regression?", "difficulty": 2, "tags": ["calibration"], "ref": "05-ml-fundamentals/classical-ml.md", "answer": "Both calibrate scores into probabilities on a held-out set. Platt fits a logistic curve (2 params; good with little data, assumes sigmoid shape). Isotonic fits a monotonic step function (flexible; needs more data; can overfit)."}, {"id": "ml-fundamentals-028", "type": "card", "question": "Steps to debug a deep model that won't learn.", "difficulty": 1, "tags": ["debugging"], "ref": "05-ml-fundamentals/deep-learning.md", "answer": "Overfit one small batch; verify data/labels and preprocessing parity; LR range test; check for NaNs; monitor per-layer gradient norms and activations; check initialization; compare against a simple baseline."}, {"id": "ml-fundamentals-029", "type": "card", "question": "Data, tensor, and pipeline parallelism: one line each.", "difficulty": 2, "tags": ["training-at-scale"], "ref": "05-ml-fundamentals/deep-learning.md", "answer": "Data: replicate the model, split the batch, all-reduce gradients. Tensor: split individual weight matrices across GPUs within a layer. Pipeline: split layers across GPUs and stream micro-batches through stages."}]}, "ml-system-design": {"topic": "ml-system-design", "title": "ML system design", "questions": [{"id": "ml-system-design-001", "type": "mcq", "question": "For most production ML problems with user behavior data, how should you split train/validation/test?", "difficulty": 1, "tags": ["data"], "ref": "03-ml-system-design/framework.md", "options": ["By label value", "Randomly by row", "By time (train on the past, validate on later data)", "Alphabetically by user name"], "answer": 2, "explanation": "Random splits leak future behavior and overestimate performance."}, {"id": "ml-system-design-002", "type": "mcq", "question": "Training-serving skew is best prevented by:", "difficulty": 1, "tags": ["features"], "ref": "03-ml-system-design/framework.md", "options": ["Using a deeper model", "Retraining more often", "Training with a larger batch size", "Computing features from one shared definition (feature store) for both training and serving, with point-in-time correct joins"], "answer": 3, "explanation": "Separate code paths for offline and online features drift apart silently."}, {"id": "ml-system-design-003", "type": "mcq", "question": "In a recommender funnel, what's the job of candidate generation?", "difficulty": 1, "tags": ["ranking"], "ref": "03-ml-system-design/framework.md", "options": ["Calibrate click probabilities", "High precision on the final 10 items", "Enforce diversity rules", "High recall: cheaply narrow millions/billions of items to ~1,000s"], "answer": 3, "explanation": "Two-tower ANN, co-occurrence, trending, rules; then a heavier ranker focuses on precision."}, {"id": "ml-system-design-004", "type": "mcq", "question": "Why are ads CTR predictions required to be well calibrated?", "difficulty": 2, "tags": ["ads"], "ref": "03-ml-system-design/case-studies.md", "options": ["Calibration reduces training time", "Users see the probabilities", "The auction multiplies pCTR by the bid, so mis-calibration misprices ads", "Calibration improves AUC"], "answer": 2, "explanation": "AUC only measures ranking; the auction needs correct absolute probabilities. Recalibrate after negative down-sampling."}, {"id": "ml-system-design-005", "type": "mcq", "question": "Fraud detection with 0.1% positives. Which offline metric is more informative?", "difficulty": 1, "tags": ["metrics"], "ref": "03-ml-system-design/metrics-and-experimentation.md", "options": ["Accuracy", "PR-AUC (or recall at a fixed false-positive rate)", "Mean squared error", "ROC-AUC only"], "answer": 1, "explanation": "Accuracy is 99.9% for 'never fraud'; ROC-AUC can look great while precision is poor."}, {"id": "ml-system-design-006", "type": "mcq", "question": "A ranking model improved offline NDCG but online engagement fell. Most likely explanation?", "difficulty": 2, "tags": ["metrics"], "ref": "03-ml-system-design/metrics-and-experimentation.md", "options": ["The A/B test is always wrong", "The offline metric/labels don't reflect the online goal (proxy mismatch, position bias, feedback loops)", "The model is too small", "NDCG is computed incorrectly by definition"], "answer": 1, "explanation": "Investigate label choice, logged-data bias, segments, and novelty effects; consider interleaving or counterfactual evaluation."}, {"id": "ml-system-design-007", "type": "mcq", "question": "Interleaving experiments are mainly used to:", "difficulty": 2, "tags": ["experimentation"], "ref": "03-ml-system-design/metrics-and-experimentation.md", "options": ["Split traffic by country", "Train models faster", "Detect data drift", "Compare two rankers with far more sensitivity than a standard A/B test"], "answer": 3, "explanation": "Blend both rankers' results in one list and attribute clicks; needs much less traffic."}, {"id": "ml-system-design-008", "type": "mcq", "question": "Sample ratio mismatch (SRM) in an A/B test means:", "difficulty": 2, "tags": ["experimentation"], "ref": "03-ml-system-design/metrics-and-experimentation.md", "options": ["The test has high power", "The observed traffic split differs significantly from the intended split, so results are untrustworthy", "The treatment effect is large", "Users saw both variants on purpose"], "answer": 1, "explanation": "Check SRM first; causes include bucketing bugs, bot filtering, and redirects."}, {"id": "ml-system-design-009", "type": "mcq", "question": "CUPED is used to:", "difficulty": 3, "tags": ["experimentation"], "ref": "03-ml-system-design/metrics-and-experimentation.md", "options": ["Reduce variance in A/B tests using pre-experiment covariates", "Choose the randomization unit", "Calibrate probabilities", "Detect fraud"], "answer": 0, "explanation": "Lower variance means smaller samples or faster decisions."}, {"id": "ml-system-design-010", "type": "mcq", "question": "Why might you randomize by cluster (e.g. city) instead of by user?", "difficulty": 3, "tags": ["experimentation"], "ref": "03-ml-system-design/metrics-and-experimentation.md", "options": ["To reduce cost", "Because users can't be identified", "Network or marketplace effects make treated and control users interfere", "To increase sample size"], "answer": 2, "explanation": "Ride-sharing or social features leak between users; switchback or cluster designs reduce interference."}, {"id": "ml-system-design-011", "type": "mcq", "question": "For video recommendations, why optimize for watch time / satisfaction rather than clicks?", "difficulty": 1, "tags": ["labels"], "ref": "03-ml-system-design/case-studies.md", "options": ["Watch time is easier to compute", "Clicks reward clickbait; watch time and satisfaction signals reflect value", "Clicks are always too sparse", "Clicks are not logged"], "answer": 1, "explanation": "Pick labels that align with long-term goals; add negative signals (hides, dislikes)."}, {"id": "ml-system-design-012", "type": "mcq", "question": "You down-sample negatives 10× for CTR training. What must you do before serving?", "difficulty": 3, "tags": ["ads", "calibration"], "ref": "03-ml-system-design/case-studies.md", "options": ["Nothing", "Recalibrate the predicted probabilities to the true base rate", "Multiply all features by 10", "Down-sample at serving time too"], "answer": 1, "explanation": "Down-sampling inflates the predicted positive rate; correct it with p' = p / (p + (1 − p)/w)."}, {"id": "ml-system-design-013", "type": "mcq", "question": "Best default model family for tabular fraud features?", "difficulty": 1, "tags": ["models"], "ref": "03-ml-system-design/case-studies.md", "options": ["A transformer over raw rows", "A CNN", "Gradient-boosted trees (XGBoost/LightGBM)", "k-means"], "answer": 2, "explanation": "Strong on heterogeneous tabular data, fast, explainable with SHAP; add graph features for fraud rings."}, {"id": "ml-system-design-014", "type": "mcq", "question": "Position bias in click logs is handled by:", "difficulty": 2, "tags": ["ranking"], "ref": "03-ml-system-design/framework.md", "options": ["Only training on the first result", "Ignoring it", "Randomizing the UI for all users permanently", "Using position as a training feature (fixed at serving) or inverse propensity weighting with exploration data"], "answer": 3, "explanation": "Top results get clicks just for being on top."}, {"id": "ml-system-design-015", "type": "mcq", "question": "ETA prediction where being late is worse than being early. Loss?", "difficulty": 2, "tags": ["models"], "ref": "03-ml-system-design/case-studies.md", "options": ["Hinge loss", "MSE", "Log loss", "Quantile (pinball) loss at a higher quantile"], "answer": 3, "explanation": "Asymmetric costs call for quantile regression (e.g. predict P70 or P80)."}, {"id": "ml-system-design-016", "type": "card", "question": "Recite the 7-step ML system design framework.", "difficulty": 1, "tags": ["framework"], "ref": "03-ml-system-design/framework.md", "answer": "1) Business goal + constraints + baseline. 2) ML framing (task, label, proxy). 3) Data (sources, labels, splits, leakage). 4) Features + model (simple → complex). 5) Serving architecture (funnel, online/batch, feature store, latency budget). 6) Evaluation (offline ↔ online, A/B, guardrails). 7) Deploy + monitor (shadow, canary, drift, retraining, feedback loops)."}, {"id": "ml-system-design-017", "type": "card", "question": "Name 5 things to monitor for a production ML model.", "difficulty": 1, "tags": ["monitoring"], "ref": "03-ml-system-design/metrics-and-experimentation.md", "answer": "Input data drift (PSI/KL), prediction drift, data quality (nulls, schema, freshness), performance once labels arrive (sliced by segment), latency/throughput/errors, business KPIs; plus alerts and retraining triggers."}, {"id": "ml-system-design-018", "type": "card", "question": "How do you handle cold start for new items and new users?", "difficulty": 2, "tags": ["recsys"], "ref": "03-ml-system-design/framework.md", "answer": "Items: content features/embeddings, creator priors, exploration slots/boosts. Users: popularity and context (geo, device, referral), onboarding questions, fast session-based updates."}, {"id": "ml-system-design-019", "type": "card", "question": "A/B test sample size rule of thumb?", "difficulty": 2, "tags": ["experimentation"], "ref": "03-ml-system-design/metrics-and-experimentation.md", "answer": "n per arm ≈ 16·σ²/δ² for α = 0.05 (two-sided) and 80% power, where δ is the minimum detectable effect. Halving the MDE needs 4× the sample."}, {"id": "ml-system-design-020", "type": "card", "question": "What's a feedback loop in recommender systems, and how do you mitigate it?", "difficulty": 2, "tags": ["recsys"], "ref": "03-ml-system-design/framework.md", "answer": "The model decides what users see, which decides what data you collect, which reinforces the model (popularity bias, filter bubbles). Mitigate with exploration traffic (randomized slots), inverse propensity weighting, diversity constraints, and logging propensities."}, {"id": "ml-system-design-021", "type": "card", "question": "Fraud system: what decisions and thresholds would you design?", "difficulty": 2, "tags": ["case-study"], "ref": "03-ml-system-design/case-studies.md", "answer": "Real-time score (< 100 ms) → approve / step-up authentication / manual review / decline, with thresholds tuned to review-queue capacity and the cost of fraud vs false declines; rules engine for known patterns; label delay handling; frequent retraining with drift monitoring."}, {"id": "ml-system-design-022", "type": "card", "question": "Harmful content: what is 'prevalence' and why measure it?", "difficulty": 3, "tags": ["case-study"], "ref": "03-ml-system-design/case-studies.md", "answer": "The fraction of views containing violating content, measured by human-labeling a random sample of impressions. It measures user exposure, which classifier precision/recall alone can't."}]}, "stats": {"topic": "stats", "title": "Probability & statistics", "questions": [{"id": "stats-001", "type": "mcq", "question": "A test has 99% sensitivity and 95% specificity; prevalence is 1%. P(disease | positive) ≈ ?", "difficulty": 1, "tags": ["bayes"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["≈ 17%", "≈ 95%", "≈ 99%", "≈ 50%"], "answer": 0, "explanation": "0.99·0.01 / (0.99·0.01 + 0.05·0.99) ≈ 0.0099 / 0.0594 ≈ 16.7%. Base rates dominate."}, {"id": "stats-002", "type": "mcq", "question": "A p-value is:", "difficulty": 1, "tags": ["testing"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["The probability the null hypothesis is true", "The effect size", "The probability the result will replicate", "The probability of observing data at least this extreme if the null hypothesis is true"], "answer": 3, "explanation": "Not P(H₀ | data)."}, {"id": "stats-003", "type": "mcq", "question": "Checking an A/B test daily and stopping at the first p < 0.05:", "difficulty": 1, "tags": ["testing"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["Has no effect on error rates", "Is the recommended practice", "Inflates the false-positive rate; use a fixed horizon or sequential testing", "Reduces false positives"], "answer": 2, "explanation": "Each peek is another chance to cross the threshold by luck."}, {"id": "stats-004", "type": "mcq", "question": "Expected number of fair coin flips to get two heads in a row?", "difficulty": 2, "tags": ["puzzles"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["8", "4", "3", "6"], "answer": 3, "explanation": "Solve E = ½(1 + E) + ¼(2 + E) + ¼·2 → E = 6."}, {"id": "stats-005", "type": "mcq", "question": "Monty Hall: should you switch?", "difficulty": 1, "tags": ["puzzles"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["Only if the host chooses randomly", "No difference; 1/2 each", "Yes; switching wins with probability 2/3", "No; staying wins 2/3"], "answer": 2, "explanation": "Your first pick is right 1/3 of the time; the host's informed reveal concentrates the remaining 2/3 on the other door."}, {"id": "stats-006", "type": "mcq", "question": "Uniform random sample of k items from a stream of unknown length:", "difficulty": 2, "tags": ["algorithms"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["Keep the first k items", "Store everything and sample at the end", "Reservoir sampling: keep item i with probability k/i, replacing a random reservoir slot", "Keep every k-th item"], "answer": 2, "explanation": "One pass, O(k) memory, exactly uniform."}, {"id": "stats-007", "type": "mcq", "question": "The Central Limit Theorem says the sample mean of many i.i.d. variables with finite variance is approximately:", "difficulty": 1, "tags": ["distributions"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["Normal with mean μ and variance σ²/n", "Uniform", "Normal with variance σ²", "Poisson"], "answer": 0, "explanation": "Standard error = σ/√n."}, {"id": "stats-008", "type": "mcq", "question": "Poisson(λ) has mean and variance:", "difficulty": 2, "tags": ["distributions"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["Mean λ, variance λ²", "Both equal λ", "Mean 1/λ, variance 1/λ²", "Mean λ, variance √λ"], "answer": 1, "explanation": "Overdispersion (variance > mean) in count data suggests a negative binomial."}, {"id": "stats-009", "type": "mcq", "question": "Unbiased sample variance divides by n − 1 because:", "difficulty": 2, "tags": ["estimation"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["Variance is always overestimated by n", "n − 1 is easier to compute", "The sample mean is estimated from the same data, using up one degree of freedom", "It makes the variance larger for safety"], "answer": 2, "explanation": "Bessel's correction."}, {"id": "stats-010", "type": "mcq", "question": "Minimizing MSE in linear regression is equivalent to maximum likelihood under:", "difficulty": 2, "tags": ["estimation"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["Laplace noise", "Bernoulli outcomes", "Uniform noise", "Gaussian noise"], "answer": 3, "explanation": "Laplace noise ↔ MAE; Bernoulli ↔ cross-entropy (logistic regression)."}, {"id": "stats-011", "type": "mcq", "question": "Testing 20 independent metrics at α = 0.05 with no real effects, expected false positives?", "difficulty": 1, "tags": ["testing"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["1", "0.05", "20", "0"], "answer": 0, "explanation": "20 × 0.05 = 1. Correct with Bonferroni or Benjamini–Hochberg."}, {"id": "stats-012", "type": "mcq", "question": "Simpson's paradox is:", "difficulty": 2, "tags": ["testing"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["Regression to the mean", "Overfitting on small samples", "Correlation implying causation", "A trend in every subgroup that reverses when the groups are combined"], "answer": 3, "explanation": "Caused by a confounder that affects group sizes; segment your analysis."}, {"id": "stats-013", "type": "mcq", "question": "Halving the minimum detectable effect in an A/B test requires roughly how much more sample?", "difficulty": 2, "tags": ["testing"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "options": ["2×", "4×", "√2×", "8×"], "answer": 1, "explanation": "n ∝ 1/δ²."}, {"id": "stats-014", "type": "card", "question": "Generate a fair bit from a biased coin.", "difficulty": 2, "tags": ["puzzles"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "answer": "Flip twice: HT → 0, TH → 1, HH or TT → discard and repeat (von Neumann). Works because P(HT) = P(TH) = p(1−p)."}, {"id": "stats-015", "type": "card", "question": "Explain a 95% confidence interval correctly.", "difficulty": 2, "tags": ["testing"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "answer": "If you repeated the experiment many times and built an interval each time, about 95% of those intervals would contain the true parameter. It's not a 95% probability that this specific interval contains it (that's a Bayesian credible interval)."}, {"id": "stats-016", "type": "card", "question": "Type I vs type II error, and power?", "difficulty": 1, "tags": ["testing"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "answer": "Type I: false positive (rejecting a true null), rate α. Type II: false negative (missing a real effect), rate β. Power = 1 − β, usually targeted at 0.8."}, {"id": "stats-017", "type": "card", "question": "Birthday problem answer for 23 people?", "difficulty": 2, "tags": ["puzzles"], "ref": "05-ml-fundamentals/probability-and-statistics.md", "answer": "≈ 50.7% chance at least two share a birthday. Compute 1 − Π(365−i)/365 for i = 0..22."}]}, "system-design": {"topic": "system-design", "title": "System design", "questions": [{"id": "system-design-001", "type": "mcq", "question": "1 million requests per day is roughly how many requests per second on average?", "difficulty": 1, "tags": ["estimation"], "ref": "02-system-design/estimation.md", "options": ["~1 RPS", "~12 RPS", "~1,200 RPS", "~120 RPS"], "answer": 1, "explanation": "1 day ≈ 86,400 s ≈ 10^5 s, so 10^6 / 10^5 ≈ 10-12."}, {"id": "system-design-002", "type": "mcq", "question": "99.99% availability allows roughly how much downtime per year?", "difficulty": 1, "tags": ["estimation", "availability"], "ref": "02-system-design/framework.md", "options": ["~53 minutes", "~3.65 days", "~8.8 hours", "~5 minutes"], "answer": 0, "explanation": "99.9% ≈ 8.8 h/yr; 99.99% ≈ 52.6 min/yr; 99.999% ≈ 5.3 min/yr."}, {"id": "system-design-003", "type": "mcq", "question": "In a Dynamo-style store with N replicas, which condition ensures reads see the latest acknowledged write?", "difficulty": 2, "tags": ["consistency"], "ref": "02-system-design/building-blocks.md", "options": ["W + R > N", "R = 1", "W + R = N", "W > N"], "answer": 0, "explanation": "Read and write quorums overlap in at least one replica."}, {"id": "system-design-004", "type": "mcq", "question": "Main purpose of consistent hashing with virtual nodes?", "difficulty": 1, "tags": ["partitioning"], "ref": "02-system-design/building-blocks.md", "options": ["Encrypt keys", "Minimize data movement when nodes are added or removed, and spread load evenly", "Make range scans efficient", "Guarantee strong consistency"], "answer": 1, "explanation": "Only about 1/n of keys move when a node changes; virtual nodes smooth out imbalance."}, {"id": "system-design-005", "type": "mcq", "question": "You need an event stream that multiple independent consumers can read and replay. Choose:", "difficulty": 1, "tags": ["messaging"], "ref": "02-system-design/building-blocks.md", "options": ["A relational table polled every second", "A work queue where messages are deleted once consumed", "A log (Kafka / Kinesis / Event Hubs / Pub/Sub)", "A cache"], "answer": 2, "explanation": "Logs retain events; each consumer group tracks its own offset; ordering is per partition."}, {"id": "system-design-006", "type": "mcq", "question": "With at-least-once delivery, how do you avoid double-charging a customer?", "difficulty": 1, "tags": ["messaging", "reliability"], "ref": "02-system-design/building-blocks.md", "options": ["Retry faster", "Use a bigger queue", "Switch to at-most-once delivery", "Idempotent consumers using an idempotency key / dedupe table"], "answer": 3, "explanation": "End-to-end exactly-once effect = at-least-once delivery + idempotent processing."}, {"id": "system-design-007", "type": "mcq", "question": "The 'transactional outbox' pattern solves:", "difficulty": 2, "tags": ["consistency"], "ref": "02-system-design/building-blocks.md", "options": ["Cache stampedes", "Updating a database and publishing an event atomically (no lost or phantom events)", "Slow DNS", "Hot partitions"], "answer": 1, "explanation": "Write the event to an outbox table in the same DB transaction; a relay publishes it to the broker."}, {"id": "system-design-008", "type": "mcq", "question": "When many requests miss the cache for the same hot key at once (stampede), a good mitigation is:", "difficulty": 2, "tags": ["caching"], "ref": "02-system-design/building-blocks.md", "options": ["Adding more database replicas only", "Disabling the cache", "Request coalescing (single-flight) and jittered TTLs / stale-while-revalidate", "Lowering the TTL to 1 second"], "answer": 2, "explanation": "Let one request rebuild the value while others wait or get stale data; jitter avoids synchronized expiry."}, {"id": "system-design-009", "type": "mcq", "question": "For cache-aside, on a write you should usually:", "difficulty": 2, "tags": ["caching"], "ref": "02-system-design/building-blocks.md", "options": ["Update the cache, then the database", "Update both in parallel with no ordering", "Never touch the cache; wait for the TTL", "Update the database, then delete (invalidate) the cache entry"], "answer": 3, "explanation": "Deleting avoids races where a stale value overwrites a fresh one; the next read repopulates it."}, {"id": "system-design-010", "type": "mcq", "question": "Which index structure favors write-heavy workloads (used by Cassandra/RocksDB)?", "difficulty": 2, "tags": ["storage"], "ref": "02-system-design/building-blocks.md", "options": ["LSM tree", "B-tree", "Bitmap index", "Hash index only"], "answer": 0, "explanation": "Writes go to a memtable and are flushed sequentially as SSTables; reads may check several (bloom filters help)."}, {"id": "system-design-011", "type": "mcq", "question": "CAP theorem: during a network partition, a system must choose between:", "difficulty": 1, "tags": ["consistency"], "ref": "02-system-design/building-blocks.md", "options": ["Consistency and availability", "Latency and throughput", "Partition tolerance and consistency", "Durability and cost"], "answer": 0, "explanation": "Partitions will happen; the choice is C or A during one. PACELC adds latency vs consistency when there's no partition."}, {"id": "system-design-012", "type": "mcq", "question": "Best fit for streaming LLM tokens from server to browser?", "difficulty": 1, "tags": ["networking"], "ref": "02-system-design/building-blocks.md", "options": ["Long polling", "Server-Sent Events (SSE)", "SMTP", "gRPC unary calls"], "answer": 1, "explanation": "SSE is simple one-way HTTP streaming; WebSockets if you need bi-directional messaging."}, {"id": "system-design-013", "type": "mcq", "question": "Offset-based pagination over a feed that receives inserts causes:", "difficulty": 2, "tags": ["api"], "ref": "02-system-design/building-blocks.md", "options": ["Faster queries", "No issues", "Duplicated or skipped items between pages; prefer cursor-based pagination", "Stronger consistency"], "answer": 2, "explanation": "Cursors (e.g. last seen ID/timestamp) are stable under inserts and scale better."}, {"id": "system-design-014", "type": "mcq", "question": "Which estimates the number of distinct users in a huge stream with ~1–2% error in kilobytes of memory?", "difficulty": 2, "tags": ["data-structures"], "ref": "02-system-design/building-blocks.md", "options": ["Reservoir sampling", "Count-Min Sketch", "Bloom filter", "HyperLogLog"], "answer": 3, "explanation": "Bloom = membership; Count-Min = frequencies; reservoir = uniform sample."}, {"id": "system-design-015", "type": "mcq", "question": "News feed for users with 50M followers. Best fan-out strategy?", "difficulty": 1, "tags": ["case-study"], "ref": "02-system-design/case-studies.md", "options": ["Hybrid: fan-out on write for most users, fan-out on read for celebrities", "Email each follower", "Fan-out on read for everyone, with no caching", "Fan-out on write for everyone"], "answer": 0, "explanation": "Pushing one post into 50M timelines is too expensive; merge celebrity posts at read time."}, {"id": "system-design-016", "type": "mcq", "question": "In a chat system, how do you guarantee message ordering within a conversation?", "difficulty": 2, "tags": ["case-study"], "ref": "02-system-design/case-studies.md", "options": ["Sort by message length", "Global ordering across all chats", "Per-conversation sequence numbers assigned by the partition owner", "Client wall-clock timestamps"], "answer": 2, "explanation": "Client clocks skew; global ordering doesn't scale. Order is only needed per conversation."}, {"id": "system-design-017", "type": "mcq", "question": "Ride-sharing: drivers send location every 4 s. Where should these updates go?", "difficulty": 2, "tags": ["case-study"], "ref": "02-system-design/case-studies.md", "options": ["An in-memory geospatial index (geohash/S2/H3 cells), not a write per update to a DB", "A relational table with one row per update", "Object storage", "A blockchain"], "answer": 0, "explanation": "Location updates are high-volume and ephemeral; persist sampled trails asynchronously if needed."}, {"id": "system-design-018", "type": "mcq", "question": "Distributed rate limiter backed by Redis: how do you avoid race conditions?", "difficulty": 2, "tags": ["case-study"], "ref": "02-system-design/case-studies.md", "options": ["Do check-and-decrement atomically (Lua script or atomic INCR with expiry)", "Read the counter, then write it in a separate call", "Use a local in-memory counter on each server only", "Use eventual consistency and hope"], "answer": 0, "explanation": "Separate read/write calls race under concurrency."}, {"id": "system-design-019", "type": "mcq", "question": "Saga pattern vs 2PC for a multi-service order flow: main advantage of a saga?", "difficulty": 3, "tags": ["consistency"], "ref": "02-system-design/building-blocks.md", "options": ["Strong isolation across services", "Simpler debugging", "No need for idempotency", "No blocking coordinator; each step commits locally with compensating actions on failure"], "answer": 3, "explanation": "Sagas trade isolation for availability; compensations must be idempotent."}, {"id": "system-design-020", "type": "mcq", "question": "Which ID scheme gives roughly time-sortable 64-bit IDs without central coordination?", "difficulty": 2, "tags": ["ids"], "ref": "02-system-design/building-blocks.md", "options": ["UUIDv4", "Snowflake (timestamp + machine ID + sequence)", "MD5 of the payload", "Auto-increment in one database"], "answer": 1, "explanation": "UUIDv4 is random (poor index locality); UUIDv7/ULID are time-ordered 128-bit alternatives."}, {"id": "system-design-021", "type": "card", "question": "List the 6 steps (with rough timings) of a 60-minute system design interview.", "difficulty": 1, "tags": ["framework"], "ref": "02-system-design/framework.md", "answer": "Requirements (0–8) → estimates (8–13) → API + data model (13–18) → high-level design, walking a request (18–30) → 2–3 deep dives (30–50) → wrap-up: bottlenecks, failures, monitoring, cost, v2 (50–60)."}, {"id": "system-design-022", "type": "card", "question": "Name 8 requirement questions to ask in every design.", "difficulty": 1, "tags": ["framework"], "ref": "02-system-design/framework.md", "answer": "Users and top use cases; out of scope; DAU and requests/user; read:write ratio; data size and growth; latency targets (p50/p99); consistency needs; availability target; geography/data residency; security/privacy/multi-tenancy."}, {"id": "system-design-023", "type": "card", "question": "Explain leader–follower replication lag and two ways to give read-your-writes.", "difficulty": 2, "tags": ["consistency"], "ref": "02-system-design/building-blocks.md", "answer": "Async followers apply writes later, so a user can read stale data right after writing. Fixes: read from the leader for a short window after the user's write (or for that user's own data); use session/version tokens and route to a replica that has caught up."}, {"id": "system-design-024", "type": "card", "question": "How do you handle a hot partition key?", "difficulty": 2, "tags": ["partitioning"], "ref": "02-system-design/building-blocks.md", "answer": "Salt the key (key#0..key#N) and aggregate on read; cache it in front; split the hot entity; use a separate path for celebrities; rate limit abusive callers."}, {"id": "system-design-025", "type": "card", "question": "Name 7 reliability patterns.", "difficulty": 1, "tags": ["reliability"], "ref": "02-system-design/building-blocks.md", "answer": "Timeouts; retries with exponential backoff + jitter; idempotency keys; circuit breakers; bulkheads; load shedding/backpressure; graceful degradation; health checks + autoscaling; canary/blue-green deploys; rate limiting."}, {"id": "system-design-026", "type": "card", "question": "URL shortener: how do you generate keys without collisions or a single bottleneck?", "difficulty": 2, "tags": ["case-study"], "ref": "02-system-design/case-studies.md", "answer": "Pre-allocate ID ranges to each app server from a coordinator (ZooKeeper/DB), base62-encode the counter; or hash + collision check. 7 base62 chars ≈ 3.5 trillion keys."}, {"id": "system-design-027", "type": "card", "question": "Web crawler: name 4 hard parts.", "difficulty": 2, "tags": ["case-study"], "ref": "02-system-design/case-studies.md", "answer": "Politeness (per-host queues, robots.txt, rate limits); URL dedupe (Bloom filter) and content dedupe (SimHash); crawler traps; recrawl scheduling by change rate; distributing by host hash; DNS caching."}, {"id": "system-design-028", "type": "card", "question": "Payment system: name 4 must-haves.", "difficulty": 2, "tags": ["case-study"], "ref": "02-system-design/case-studies.md", "answer": "Idempotency keys on every API; double-entry, append-only ledger; payment state machine; async PSP webhooks with retries; daily reconciliation; audit logs; saga + outbox for cross-service flows."}]}};
const INTERVAL_DAYS = [0, 1, 3, 7, 16, 35];
const DAY = 86400000;
const KEY = "core-foundry-progress-v1";

function loadProgress() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
function saveProgress(p) { try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) { /* storage unavailable: session only */ } }
let progress = loadProgress();

const isDue = (rec, now) => !rec || now >= (rec.last || 0) + INTERVAL_DAYS[rec.box || 0] * DAY;
function record(id, quality) {
  const rec = progress[id] || (progress[id] = { box: 0, seen: 0, correct: 0 });
  rec.seen++; rec.last = Date.now();
  if (quality === 2) { rec.correct++; rec.box = Math.min(rec.box + 1, INTERVAL_DAYS.length - 1); }
  else if (quality === 0) rec.box = 0;
  saveProgress(progress);
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

// Topic chips
const selected = new Set(Object.keys(BANK));
for (const [topic, doc] of Object.entries(BANK)) {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.setAttribute("aria-pressed", "true");
  b.textContent = `${doc.title} (${doc.questions.length})`;
  b.onclick = () => { selected.has(topic) ? selected.delete(topic) : selected.add(topic); b.setAttribute("aria-pressed", selected.has(topic)); };
  $("topics").appendChild(b);
}

let session = [], idx = 0, results = [], awaiting = null;

function pick() {
  const now = Date.now(), mode = $("mode").value, n = +$("count").value;
  const pool = [];
  for (const t of selected) for (const q of BANK[t].questions) {
    if (mode === "mcq" && q.type !== "mcq") continue;
    if (mode === "cards" && q.type !== "card") continue;
    pool.push(q);
  }
  const due = shuffle(pool.filter(q => progress[q.id] && isDue(progress[q.id], now)));
  const fresh = shuffle(pool.filter(q => !progress[q.id]));
  const rest = shuffle(pool.filter(q => progress[q.id] && !isDue(progress[q.id], now)));
  return shuffle([...due, ...fresh, ...($("dueOnly").checked ? [] : rest)].slice(0, n));
}

function start() {
  if (!selected.size) { alert("Pick at least one topic."); return; }
  session = pick(); idx = 0; results = [];
  if (!session.length) { $("stats").classList.remove("hidden"); $("stats").innerHTML = "<p>Nothing due right now. Untick “Only due + new” to keep practicing.</p>"; return; }
  $("setup").classList.add("hidden"); $("stats").classList.add("hidden"); $("quiz").classList.remove("hidden");
  show();
}

function show() {
  const q = session[idx];
  $("bar").style.width = `${(idx / session.length) * 100}%`;
  $("meta").textContent = `${idx + 1} / ${session.length} · ${BANK[q.id.replace(/-\d+$/, "")]?.title || ""} · ${q.tags.join(", ")}`;
  $("question").textContent = q.question;
  const body = $("body"); body.innerHTML = "";
  if (q.type === "mcq") {
    q.options.forEach((opt, k) => {
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.innerHTML = `<span class="k">${"ABCDEF"[k]}</span>${esc(opt)}`;
      b.onclick = () => answerMcq(k);
      body.appendChild(b);
    });
    awaiting = "mcq";
  } else {
    const b = document.createElement("button");
    b.className = "primary"; b.type = "button"; b.textContent = "Reveal answer";
    b.onclick = reveal; body.appendChild(b);
    awaiting = "reveal";
  }
}

function answerMcq(k) {
  if (awaiting !== "mcq") return;
  const q = session[idx], right = k === q.answer;
  [...document.querySelectorAll(".opt")].forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add("right"); else if (i === k) b.classList.add("wrong");
  });
  record(q.id, right ? 2 : 0); results.push(right ? 2 : 0);
  const fb = document.createElement("div"); fb.className = "feedback";
  fb.innerHTML = `<strong class="${right ? "good" : "bad"}">${right ? "Correct." : "Not quite."}</strong> ${esc(q.explanation)}<div class="ref">Read more: ${esc(q.ref)}</div>`;
  $("body").appendChild(fb); addNext();
}

function reveal() {
  const q = session[idx];
  $("body").innerHTML = `<div class="feedback answer">${esc(q.answer)}<div class="ref">Read more: ${esc(q.ref)}</div></div>`;
  const row = document.createElement("div"); row.className = "row";
  [["Again", 0], ["Hard", 1], ["Good", 2]].forEach(([label, quality]) => {
    const b = document.createElement("button"); b.type = "button";
    b.className = quality === 2 ? "primary" : "secondary"; b.textContent = label;
    b.onclick = () => grade(quality); row.appendChild(b);
  });
  $("body").appendChild(row); awaiting = "grade";
}

function grade(quality) {
  if (awaiting !== "grade") return;
  record(session[idx].id, quality); results.push(quality); next();
}

function addNext() {
  const b = document.createElement("button"); b.className = "primary"; b.type = "button";
  b.textContent = idx + 1 < session.length ? "Next" : "Finish"; b.style.marginTop = "12px";
  b.onclick = next; $("body").appendChild(b); b.focus(); awaiting = "next";
}

function next() {
  idx++;
  if (idx < session.length) { show(); return; }
  awaiting = null;
  const good = results.filter(r => r === 2).length;
  $("quiz").classList.add("hidden"); $("setup").classList.remove("hidden");
  renderStats(`<p><strong>Score: ${good}/${results.length}</strong> (${Math.round(100 * good / Math.max(results.length, 1))}%)</p>`);
}

function renderStats(prefix = "") {
  const now = Date.now();
  let rows = "";
  for (const [t, doc] of Object.entries(BANK)) {
    const seen = doc.questions.filter(q => progress[q.id]);
    const mastered = seen.filter(q => progress[q.id].box >= 3).length;
    const due = seen.filter(q => isDue(progress[q.id], now)).length;
    rows += `<tr><td>${esc(doc.title)}</td><td>${doc.questions.length}</td><td>${seen.length}</td><td>${mastered}</td><td>${due}</td></tr>`;
  }
  $("stats").innerHTML = `${prefix}<p class="label">Progress</p><table><tr><th>Topic</th><th>Total</th><th>Seen</th><th>Mastered</th><th>Due</th></tr>${rows}</table>
    <p class="hint">Mastered = correct on 3 spaced reviews. Progress is stored only in this browser.</p>
    <button class="secondary" id="reset">Reset progress</button>`;
  $("stats").classList.remove("hidden");
  $("reset").onclick = () => { if (confirm("Delete all saved progress in this browser?")) { progress = {}; saveProgress(progress); renderStats(); } };
}

$("start").onclick = start;
$("showStats").onclick = () => renderStats();
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey) return;
  const key = e.key.toUpperCase();
  if (awaiting === "mcq") {
    const k = "ABCDEF".indexOf(key) >= 0 ? "ABCDEF".indexOf(key) : "123456".indexOf(key);
    if (k >= 0 && k < session[idx].options.length) { e.preventDefault(); answerMcq(k); }
  } else if (awaiting === "reveal" && (key === " " || key === "ENTER")) { e.preventDefault(); reveal(); }
  else if (awaiting === "grade" && "123".includes(key)) { e.preventDefault(); grade(+key - 1); }
  else if (awaiting === "next" && (key === " " || key === "ENTER")) { e.preventDefault(); next(); }
});
</script>
