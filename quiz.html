<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Foundry Quiz</title>
<style>
:root {
  --bg: #f6f7fb; --surface: #ffffff; --ink: #121826; --muted: #5b6577; --line: #e3e7ef;
  --accent: #2557d6; --accent-ink: #ffffff; --good: #16794a; --bad: #b42318; --good-bg: #e7f6ee; --bad-bg: #fdecea;
  --chip: #eef2fb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --surface: #161b24; --ink: #e8ecf3; --muted: #9aa4b5; --line: #273041;
    --accent: #6b9bff; --accent-ink: #0d1117; --good: #4cc38a; --bad: #ff7b72; --good-bg: #12291e; --bad-bg: #2d1515;
    --chip: #1e2533;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.4rem; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 14px; }
select, button.primary, button.secondary { font: inherit; border-radius: 10px; padding: 9px 14px; }
select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
button.primary { background: var(--accent); color: var(--accent-ink); border: 0; cursor: pointer; font-weight: 600; }
button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
button:focus-visible, .opt:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.meta { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
.q { font-size: 1.12rem; font-weight: 600; margin: 0 0 14px; }
.opt { display: block; width: 100%; text-align: left; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 8px 0; cursor: pointer; font: inherit; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { display: inline-block; width: 1.6em; font-weight: 700; color: var(--muted); }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.feedback { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--chip); }
.feedback strong.good { color: var(--good); } .feedback strong.bad { color: var(--bad); }
.answer { white-space: pre-wrap; }
.ref { color: var(--muted); font-size: .85rem; margin-top: 8px; word-break: break-word; }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
th:not(:first-child), td:not(:first-child) { text-align: right; }
.hint { color: var(--muted); font-size: .82rem; margin-top: 10px; }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Interview prep quiz</h1>
  <p class="sub">250 questions · spaced repetition saved in this browser</p>

  <section id="setup" class="card">
    <p class="label">Topics</p>
    <div class="chips" id="topics"></div>
    <div class="row">
      <label>Questions <select id="count"><option>10</option><option selected>15</option><option>25</option><option>40</option></select></label>
      <label>Mode <select id="mode"><option value="mixed">Mixed</option><option value="mcq">Multiple choice</option><option value="cards">Flashcards</option></select></label>
      <label><input type="checkbox" id="dueOnly"> Only due + new</label>
    </div>
    <div class="row">
      <button class="primary" id="start">Start</button>
      <button class="secondary" id="showStats">Progress</button>
    </div>
    <p class="hint">Keys: A–D or 1–4 to answer · Space/Enter to reveal or continue · in flashcards: 1 again, 2 hard, 3 good.</p>
  </section>

  <section id="quiz" class="card hidden" aria-live="polite">
    <div class="progress"><div id="bar"></div></div>
    <div class="meta" id="meta"></div>
    <p class="q" id="question"></p>
    <div id="body"></div>
  </section>

  <section id="stats" class="card hidden"></section>
</main>
<script>
const BANK = {"behavioral": {"topic": "behavioral", "title": "Behavioral, leadership & loop strategy", "questions": [{"id": "behavioral-001", "type": "card", "question": "Amazon LP: 'Customer Obsession'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Start with the customer and work backward; earn and keep customer trust. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-002", "type": "card", "question": "Amazon LP: 'Ownership'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Think long term, act on behalf of the whole company, never say 'that's not my job'. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-003", "type": "card", "question": "Amazon LP: 'Invent and Simplify'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Expect and require innovation; find ways to simplify; accept ideas from anywhere. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-004", "type": "card", "question": "Amazon LP: 'Are Right, A Lot'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Strong judgment and instincts; seek diverse perspectives; work to disconfirm your own beliefs. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-005", "type": "card", "question": "Amazon LP: 'Learn and Be Curious'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Never done learning; explore new possibilities. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-006", "type": "card", "question": "Amazon LP: 'Hire and Develop the Best'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Raise the performance bar with every hire and promotion; coach others. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-007", "type": "card", "question": "Amazon LP: 'Insist on the Highest Standards'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Relentlessly high standards; fix problems so they stay fixed. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-008", "type": "card", "question": "Amazon LP: 'Think Big'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Create and communicate a bold direction that inspires results. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-009", "type": "card", "question": "Amazon LP: 'Bias for Action'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Speed matters; many decisions are reversible; take calculated risks. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-010", "type": "card", "question": "Amazon LP: 'Frugality'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Accomplish more with less; no extra points for headcount or budget. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-011", "type": "card", "question": "Amazon LP: 'Earn Trust'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Listen attentively, speak candidly, be self-critical, benchmark against the best. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-012", "type": "card", "question": "Amazon LP: 'Dive Deep'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Operate at all levels, stay connected to details, audit frequently, be skeptical when metrics and anecdotes differ. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-013", "type": "card", "question": "Amazon LP: 'Have Backbone; Disagree and Commit'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Respectfully challenge decisions you disagree with; once decided, commit wholly. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-014", "type": "card", "question": "Amazon LP: 'Deliver Results'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Focus on key inputs; deliver with quality and on time despite setbacks. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-015", "type": "card", "question": "Amazon LP: 'Strive to be Earth's Best Employer'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Create a safer, more productive, diverse, and just work environment; lead with empathy. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-016", "type": "card", "question": "Amazon LP: 'Success and Scale Bring Broad Responsibility'. What does it mean, and which of your stories fits?", "difficulty": 2, "tags": ["amazon", "lp"], "ref": "06-behavioral/amazon-leadership-principles.md", "answer": "Be humble and thoughtful about secondary effects; leave things better than you found them. → Name your story (see the mapping table in amazon-leadership-principles.md)."}, {"id": "behavioral-017", "type": "mcq", "question": "How many Amazon Leadership Principles are there today?", "difficulty": 1, "tags": ["amazon"], "ref": "06-behavioral/amazon-leadership-principles.md", "options": ["12", "14", "16", "10"], "answer": 2, "explanation": "Two were added in 2021: Strive to be Earth's Best Employer, and Success and Scale Bring Broad Responsibility."}, {"id": "behavioral-018", "type": "mcq", "question": "What is Amazon's 'Bar Raiser'?", "difficulty": 1, "tags": ["amazon"], "ref": "06-behavioral/amazon-leadership-principles.md", "options": ["A peer reference check", "An experienced interviewer from outside the hiring team who ensures hires raise the bar and can veto", "The hiring manager", "A coding test"], "answer": 1, "explanation": "Expect deeper follow-ups and probing of your weakest-looking area."}, {"id": "behavioral-019", "type": "mcq", "question": "In STAR-L, roughly what share of a story should be Actions?", "difficulty": 1, "tags": ["star"], "ref": "06-behavioral/story-framework.md", "options": ["About 90%", "About 10%", "About half", "About 25%"], "answer": 2, "explanation": "Situation and task are short context; actions show what *you* did; results and learning close it."}, {"id": "behavioral-020", "type": "mcq", "question": "Which story trait most clearly signals Staff level?", "difficulty": 1, "tags": ["staff"], "ref": "00-strategy/staff-level-signals.md", "options": ["Aligning multiple teams on a direction you defined under ambiguity, with measurable business impact", "Using a new framework", "Working long hours to hit a deadline", "Fixing a bug quickly on your own"], "answer": 0, "explanation": "Scope, ambiguity, influence without authority, and impact."}, {"id": "behavioral-021", "type": "mcq", "question": "Google's L6 loop typically includes which non-coding rounds?", "difficulty": 2, "tags": ["google"], "ref": "00-strategy/loops-by-company.md", "options": ["A personality test only", "A presentation to the CEO", "System design (often 2), Role-Related Knowledge, and Googleyness & Leadership", "Only a take-home project"], "answer": 2, "explanation": "Followed by hiring committee and team matching."}, {"id": "behavioral-022", "type": "mcq", "question": "Google's standard coding interview environment usually:", "difficulty": 2, "tags": ["google"], "ref": "00-strategy/loops-by-company.md", "options": ["Allows any AI assistant", "Has a full IDE with debugger", "Doesn't run code and has no autocomplete, so practice writing correct code without executing it", "Is multiple choice"], "answer": 2, "explanation": "Dry-run by hand. (Verify the current format with your recruiter.)"}, {"id": "behavioral-023", "type": "mcq", "question": "Meta's AI-assisted coding round evaluates you mainly on:", "difficulty": 1, "tags": ["meta", "ai-coding"], "ref": "00-strategy/ai-assisted-coding.md", "options": ["Problem solving, code quality, how you steer and verify the AI, and communication", "Memorized LeetCode solutions", "How fast the AI can solve the problem alone", "Typing speed"], "answer": 0, "explanation": "Explain the approach before prompting, delegate small pieces, review every line, and test."}, {"id": "behavioral-024", "type": "mcq", "question": "Amazon's stated guidance on GenAI tools during interviews (reported 2025):", "difficulty": 1, "tags": ["amazon"], "ref": "00-strategy/loops-by-company.md", "options": ["There's no policy", "Don't use them unless explicitly permitted; doing so may disqualify you", "They're encouraged in every round", "Only allowed in behavioral rounds"], "answer": 1, "explanation": "Prepare to code unassisted for Amazon."}, {"id": "behavioral-025", "type": "mcq", "question": "In a Meta loop, the behavioral round:", "difficulty": 2, "tags": ["meta"], "ref": "00-strategy/loops-by-company.md", "options": ["Only matters for managers", "Is unscored", "Is optional", "Can change your level (e.g. E5 → E4) on its own"], "answer": 3, "explanation": "Bring Staff-scope stories for E6+."}, {"id": "behavioral-026", "type": "card", "question": "What are the 5 parts of STAR-L, with time shares?", "difficulty": 1, "tags": ["star"], "ref": "06-behavioral/story-framework.md", "answer": "Situation (10%) → Task (10%) → Actions (50%, 'I' not 'we') → Result (20%, with numbers) → Learning (10%)."}, {"id": "behavioral-027", "type": "card", "question": "What must a good failure story include?", "difficulty": 1, "tags": ["star"], "ref": "06-behavioral/story-framework.md", "answer": "A real failure you owned with real consequences → your part in it → how you limited the damage → the systemic change so it can't recur → what you changed about how you work."}, {"id": "behavioral-028", "type": "card", "question": "Five phrases that signal Staff thinking in a design round.", "difficulty": 1, "tags": ["staff"], "ref": "00-strategy/staff-level-signals.md", "answer": "'What does success look like in 6 months, and what won't we support?' / 'Two viable options; here's the trade-off and what would make me switch.' / 'The riskiest part is X, so I'd de-risk it first.' / 'This needs agreement from teams A and B; here's how.' / 'I'd measure ..., and roll back if ...'"}, {"id": "behavioral-029", "type": "card", "question": "Your top differentiator for applied AI design rounds?", "difficulty": 1, "tags": ["staff"], "ref": "00-strategy/staff-level-signals.md", "answer": "Production depth others lack: evaluation harnesses and release gates, permission-aware retrieval, cost/latency engineering, guardrails, and rollout, backed by real systems you led (an enterprise RAG platform for thousands of users; a ~70K docs/month multi-agent pipeline; teams of 8–20)."}, {"id": "behavioral-030", "type": "card", "question": "Workflow for the AI-assisted coding round?", "difficulty": 1, "tags": ["ai-coding"], "ref": "00-strategy/ai-assisted-coding.md", "answer": "Clarify with the interviewer → design and complexity out loud → delegate small, specific pieces to the AI → review every line and explain it → write/ask for tests, run, fix → revisit the design when a new requirement arrives."}, {"id": "behavioral-031", "type": "card", "question": "Netflix culture: name 3 ideas you should be ready to discuss.", "difficulty": 2, "tags": ["netflix"], "ref": "00-strategy/loops-by-company.md", "answer": "Freedom and responsibility; candid feedback; the 'keeper test' (would your manager fight to keep you?); context, not control; highly aligned, loosely coupled teams."}]}, "coding": {"topic": "coding", "title": "Coding patterns & complexity", "questions": [{"id": "coding-001", "type": "mcq", "question": "'Number of subarrays whose sum equals K' with negative numbers allowed. Which pattern?", "difficulty": 2, "tags": ["prefix-sum"], "ref": "01-coding/patterns/arrays-and-strings.md", "options": ["Sliding window", "Binary search", "Monotonic stack", "Prefix sums + hash map of prefix-sum counts"], "answer": 3, "explanation": "Negatives break sliding-window monotonicity. Count prefix[j] − K occurrences seen so far; seed the map with {0: 1}."}, {"id": "coding-002", "type": "mcq", "question": "'Longest substring with at most K distinct characters'. Which pattern?", "difficulty": 1, "tags": ["sliding-window"], "ref": "01-coding/patterns/arrays-and-strings.md", "options": ["Union-find", "Backtracking", "Prefix sums", "Sliding window with a character-count map"], "answer": 3, "explanation": "Expand right, shrink left while the window has > K distinct; O(n)."}, {"id": "coding-003", "type": "mcq", "question": "For each day, find how many days until a warmer temperature. Which pattern gives O(n)?", "difficulty": 1, "tags": ["monotonic-stack"], "ref": "01-coding/patterns/stacks-queues-linked-lists.md", "options": ["Binary search on each suffix", "Two pointers from both ends", "Monotonic (decreasing) stack of indices", "Min-heap"], "answer": 2, "explanation": "Each index is pushed and popped once; pop while the current temperature is warmer."}, {"id": "coding-004", "type": "mcq", "question": "'Minimum ship capacity to ship all packages within D days'. Which pattern?", "difficulty": 2, "tags": ["binary-search"], "ref": "01-coding/patterns/binary-search.md", "options": ["BFS", "Binary search on the answer with a feasibility check", "Dynamic programming over days", "Greedy sort descending"], "answer": 1, "explanation": "Feasibility is monotonic in capacity: if C works, C+1 works. Search between max(weight) and sum(weights)."}, {"id": "coding-005", "type": "mcq", "question": "Shortest path in an unweighted grid. Which algorithm?", "difficulty": 1, "tags": ["graphs"], "ref": "01-coding/patterns/graphs.md", "options": ["BFS", "Dijkstra", "DFS", "Bellman-Ford"], "answer": 0, "explanation": "BFS explores by distance layers, so the first time you reach the target is the shortest path. O(V+E)."}, {"id": "coding-006", "type": "mcq", "question": "Shortest path with non-negative edge weights. Which algorithm?", "difficulty": 1, "tags": ["graphs"], "ref": "01-coding/patterns/graphs.md", "options": ["Dijkstra with a min-heap", "Topological sort", "BFS", "Floyd–Warshall for a single source"], "answer": 0, "explanation": "O(E log V). Negative weights need Bellman-Ford."}, {"id": "coding-007", "type": "mcq", "question": "'Can you finish all courses given prerequisites?' Which approach?", "difficulty": 1, "tags": ["graphs"], "ref": "01-coding/patterns/graphs.md", "options": ["Binary search", "Topological sort (Kahn's algorithm) and check for a cycle", "Dijkstra", "Union-find on the prerequisites"], "answer": 1, "explanation": "If the topological order contains fewer than n nodes, there's a cycle, so it's impossible."}, {"id": "coding-008", "type": "mcq", "question": "Detect whether adding an edge creates a cycle in an undirected graph, processing edges one by one. Best structure?", "difficulty": 1, "tags": ["graphs", "union-find"], "ref": "01-coding/patterns/graphs.md", "options": ["Trie", "Min-heap", "Monotonic queue", "Union-find (disjoint set union)"], "answer": 3, "explanation": "If both endpoints already share a root, the edge is redundant. Near O(1) per operation with path compression + union by rank."}, {"id": "coding-009", "type": "mcq", "question": "Find the K largest elements of a stream of n numbers with O(n log k). Which structure?", "difficulty": 1, "tags": ["heap"], "ref": "01-coding/patterns/heaps-intervals-greedy.md", "options": ["A hash set", "A max-heap of all n elements", "A min-heap of size K", "A sorted array with insertion"], "answer": 2, "explanation": "Keep the K largest seen; push, and pop the smallest when the size exceeds K."}, {"id": "coding-010", "type": "mcq", "question": "Running median of a data stream. Which design?", "difficulty": 2, "tags": ["heap"], "ref": "01-coding/patterns/heaps-intervals-greedy.md", "options": ["A trie", "One sorted list with binary insertion (O(n) insert)", "A single min-heap", "Two heaps: a max-heap for the lower half and a min-heap for the upper half"], "answer": 3, "explanation": "Rebalance so sizes differ by at most 1; the median is a top or the average of the tops. O(log n) add, O(1) median."}, {"id": "coding-011", "type": "mcq", "question": "Minimum number of meeting rooms for a set of intervals. Approach?", "difficulty": 1, "tags": ["intervals"], "ref": "01-coding/patterns/heaps-intervals-greedy.md", "options": ["DP over intervals", "Sort starts and ends separately (or a min-heap of end times) and sweep", "Union-find", "BFS"], "answer": 1, "explanation": "Count overlapping intervals at any time; O(n log n)."}, {"id": "coding-012", "type": "mcq", "question": "Minimum intervals to remove so the rest don't overlap. Greedy rule?", "difficulty": 2, "tags": ["greedy", "intervals"], "ref": "01-coding/patterns/heaps-intervals-greedy.md", "options": ["Remove the interval with the most overlaps first", "Sort by start time; keep the longest", "Sort by length; keep the shortest", "Sort by end time; keep the interval that ends earliest"], "answer": 3, "explanation": "Ending earliest leaves the most room for the rest (exchange argument)."}, {"id": "coding-013", "type": "mcq", "question": "Generate all subsets of n distinct numbers. Time complexity?", "difficulty": 1, "tags": ["backtracking", "complexity"], "ref": "01-coding/patterns/backtracking.md", "options": ["O(n · 2^n)", "O(2^n) with no extra factor", "O(n²)", "O(n!)"], "answer": 0, "explanation": "2^n subsets, each up to n long to copy."}, {"id": "coding-014", "type": "mcq", "question": "In 0/1 knapsack with a 1-D dp array, why iterate capacity backwards?", "difficulty": 2, "tags": ["dp"], "ref": "01-coding/patterns/dynamic-programming.md", "options": ["Iterating forwards is also correct for 0/1 knapsack", "So each item is used at most once (dp[s − w] still refers to the previous item's row)", "Because Python lists are reversed", "To make it faster"], "answer": 1, "explanation": "Forward iteration lets an item be reused, which is the unbounded knapsack (coin change)."}, {"id": "coding-015", "type": "mcq", "question": "Best known complexity for Longest Increasing Subsequence?", "difficulty": 2, "tags": ["dp", "binary-search"], "ref": "01-coding/patterns/dynamic-programming.md", "options": ["O(n)", "O(n²) is optimal", "O(n log n) with patience sorting (tails array + binary search)", "O(2^n)"], "answer": 2, "explanation": "tails[k] = smallest tail of an increasing subsequence of length k+1; bisect_left each element."}, {"id": "coding-016", "type": "mcq", "question": "Edit distance between strings of length m and n. Complexity?", "difficulty": 1, "tags": ["dp"], "ref": "01-coding/patterns/dynamic-programming.md", "options": ["O(2^(m+n))", "O(m·n) time, reducible to O(min(m, n)) space", "O(m + n)", "O(m·n·log n)"], "answer": 1, "explanation": "dp[i][j] from delete, insert, replace/match; only the previous row is needed."}, {"id": "coding-017", "type": "mcq", "question": "Design a cache with O(1) get and put that evicts the least recently used item. Structures?", "difficulty": 1, "tags": ["design"], "ref": "01-coding/patterns/design-data-structures.md", "options": ["Balanced BST", "Array with linear scan", "Min-heap keyed by access time", "Hash map + doubly linked list"], "answer": 3, "explanation": "The map gives O(1) lookup; the list gives O(1) move-to-front and removal of the tail."}, {"id": "coding-018", "type": "mcq", "question": "Which rate limiter allows short bursts while enforcing an average rate, with O(1) memory?", "difficulty": 1, "tags": ["design"], "ref": "01-coding/patterns/design-data-structures.md", "options": ["Fixed window counter with no expiry", "Sliding window log", "Leaky bucket with an unbounded queue", "Token bucket"], "answer": 3, "explanation": "Tokens refill at rate r up to capacity b; each request spends a token."}, {"id": "coding-019", "type": "mcq", "question": "Validate a BST correctly. Key idea?", "difficulty": 1, "tags": ["trees"], "ref": "01-coding/patterns/trees-and-tries.md", "options": ["Check the tree is balanced", "Check node.left.val < node.val < node.right.val at each node only", "Pass (low, high) bounds down the recursion", "BFS and compare siblings"], "answer": 2, "explanation": "Local child checks miss violations deeper in the tree (a right-subtree node smaller than an ancestor)."}, {"id": "coding-020", "type": "mcq", "question": "Autocomplete over a dictionary of words by prefix. Best structure?", "difficulty": 1, "tags": ["trie"], "ref": "01-coding/patterns/trees-and-tries.md", "options": ["Min-heap", "Bloom filter", "Trie", "Union-find"], "answer": 2, "explanation": "Walk the prefix in O(L), then enumerate descendants (store top-K at nodes for speed)."}, {"id": "coding-021", "type": "mcq", "question": "Floyd's cycle detection: after slow and fast pointers meet, how do you find the cycle start?", "difficulty": 2, "tags": ["linked-list"], "ref": "01-coding/patterns/stacks-queues-linked-lists.md", "options": ["Reset one pointer to head; move both one step at a time; they meet at the cycle start", "Reverse the list", "The meeting point is the cycle start", "Count nodes and divide by 2"], "answer": 0, "explanation": "The distance from head to start equals the distance from the meeting point to start (mod cycle length)."}, {"id": "coding-022", "type": "mcq", "question": "Python: which operation is O(n)?", "difficulty": 1, "tags": ["python"], "ref": "01-coding/python-for-interviews.md", "options": ["list.append(x)", "dict lookup", "list.pop(0)", "deque.popleft()"], "answer": 2, "explanation": "Popping from the front shifts every element; use collections.deque."}, {"id": "coding-023", "type": "mcq", "question": "n ≤ 20 and you need to try all subsets with DP state. Feasible complexity?", "difficulty": 2, "tags": ["complexity"], "ref": "01-coding/complexity-cheatsheet.md", "options": ["O(n!) is fine", "Only O(n²)", "O(n · 2^n) (bitmask DP)", "O(2^(2^n))"], "answer": 2, "explanation": "2^20 ≈ 10^6 states × 20 ≈ 2×10^7 operations: fine."}, {"id": "coding-024", "type": "mcq", "question": "n = 10^6. Which complexity is generally acceptable?", "difficulty": 1, "tags": ["complexity"], "ref": "01-coding/complexity-cheatsheet.md", "options": ["O(n log n)", "O(n³)", "O(n²)", "O(2^n)"], "answer": 0, "explanation": "10^6 × 20 ≈ 2×10^7 operations; O(n²) = 10^12 is far too slow."}, {"id": "coding-025", "type": "mcq", "question": "Python heapq is a…", "difficulty": 1, "tags": ["python", "heap"], "ref": "01-coding/python-for-interviews.md", "options": ["Max-heap", "Balanced BST", "Min-heap (negate values for a max-heap)", "Fibonacci heap"], "answer": 2, "explanation": "Push tuples (priority, tiebreak, item) so items are never compared directly."}, {"id": "coding-026", "type": "mcq", "question": "What's wrong with grid = [[0]*cols]*rows in Python?", "difficulty": 1, "tags": ["python"], "ref": "01-coding/python-for-interviews.md", "options": ["It's O(n³) to create", "All rows are the same list object, so writing one cell changes every row", "It creates a tuple, which is immutable", "Nothing"], "answer": 1, "explanation": "Use [[0]*cols for _ in range(rows)]."}, {"id": "coding-027", "type": "mcq", "question": "Search in a rotated sorted array in O(log n). Key observation?", "difficulty": 2, "tags": ["binary-search"], "ref": "01-coding/patterns/binary-search.md", "options": ["Binary search doesn't work on rotated arrays", "The array's minimum is always at index 0", "You must first un-rotate the array in O(n)", "At every step, at least one half (lo..mid or mid..hi) is sorted"], "answer": 3, "explanation": "Check whether the target lies within the sorted half; recurse into the correct side."}, {"id": "coding-028", "type": "mcq", "question": "Exactly K distinct elements in subarrays: classic trick?", "difficulty": 3, "tags": ["sliding-window"], "ref": "01-coding/patterns/arrays-and-strings.md", "options": ["Bitmask DP", "Use a heap of size K", "exactly(K) = atMost(K) − atMost(K − 1)", "Sort and two pointers"], "answer": 2, "explanation": "Sliding window solves 'at most' cleanly; subtract to get 'exactly'."}, {"id": "coding-029", "type": "mcq", "question": "Maximum of every window of size k in O(n). Structure?", "difficulty": 2, "tags": ["monotonic-queue"], "ref": "01-coding/patterns/stacks-queues-linked-lists.md", "options": ["Monotonic deque of indices (values decreasing)", "Prefix maxima", "Sort each window", "Min-heap with lazy deletion only"], "answer": 0, "explanation": "Pop smaller values from the back, expired indices from the front; the front is the max."}, {"id": "coding-030", "type": "card", "question": "Say the 6-step coding interview script.", "difficulty": 1, "tags": ["process"], "ref": "01-coding/README.md", "answer": "1) Restate + clarify (sizes, edge cases). 2) Brute force + complexity. 3) Name the pattern + target complexity; get buy-in. 4) Write clean code with helpers. 5) Dry-run by hand + edge cases. 6) Final complexity + a follow-up (streaming, distributed, memory)."}, {"id": "coding-031", "type": "card", "question": "Recognition cues for dynamic programming?", "difficulty": 1, "tags": ["dp"], "ref": "01-coding/patterns/dynamic-programming.md", "answer": "'Number of ways', 'min/max cost', 'is it possible', choices at each step, and a brute-force recursion that repeats the same arguments (overlapping subproblems) with optimal substructure."}, {"id": "coding-032", "type": "card", "question": "4-step DP recipe?", "difficulty": 1, "tags": ["dp"], "ref": "01-coding/patterns/dynamic-programming.md", "answer": "1) Define the state in words. 2) Transition from smaller states. 3) Base cases. 4) Iteration order + where the answer is; then optimize space."}, {"id": "coding-033", "type": "card", "question": "When does sliding window NOT work for subarray sums?", "difficulty": 2, "tags": ["sliding-window"], "ref": "01-coding/patterns/arrays-and-strings.md", "answer": "When numbers can be negative: growing the window doesn't monotonically increase the sum, so you can't decide when to shrink. Use prefix sums + hash map instead."}, {"id": "coding-034", "type": "card", "question": "How does Alien Dictionary build its graph, and what's the tricky edge case?", "difficulty": 3, "tags": ["graphs"], "ref": "01-coding/patterns/graphs.md", "answer": "Compare adjacent words; the first differing characters give an edge (a → b). Topologically sort. Edge case: if a word is followed by its own strict prefix (e.g. 'abc' then 'ab'), the order is invalid; also detect cycles."}, {"id": "coding-035", "type": "card", "question": "Follow-ups for an LRU cache in a practical round?", "difficulty": 2, "tags": ["design"], "ref": "01-coding/patterns/design-data-structures.md", "answer": "Thread safety (one lock or striped locks), TTL (expiry + lazy check + heap sweep), metrics (hit rate), distributed cache (consistent hashing, each node runs its own LRU), memory-bounded by bytes instead of count."}, {"id": "coding-036", "type": "card", "question": "How do you implement nested transactions (begin/commit/rollback) for a KV store?", "difficulty": 3, "tags": ["design"], "ref": "01-coding/patterns/design-data-structures.md", "answer": "Keep a stack of change logs. On set/delete inside a transaction, record the key's previous value (or a 'didn't exist' tombstone) in the top log if not already recorded. Rollback restores from the top log and pops it. Commit merges the top log into the one below (keeping the older original values), or discards it at the outermost level."}]}, "genai": {"topic": "genai", "title": "GenAI & LLM system design", "questions": [{"id": "genai-001", "type": "mcq", "question": "A RAG assistant often fails on queries containing exact error codes like 'ERR_4012', even though the right doc is indexed. Best first fix?", "difficulty": 2, "tags": ["rag", "retrieval"], "ref": "04-genai-system-design/rag.md", "options": ["Increase the embedding dimension", "Fine-tune the LLM on the error-code docs", "Raise the LLM temperature", "Add keyword (BM25) retrieval and fuse it with vector results (hybrid search)"], "answer": 3, "explanation": "Dense embeddings blur rare exact tokens like IDs and codes. BM25 matches them exactly; Reciprocal Rank Fusion combines both lists."}, {"id": "genai-002", "type": "mcq", "question": "What does Reciprocal Rank Fusion (RRF) use to combine result lists?", "difficulty": 2, "tags": ["rag", "retrieval"], "ref": "04-genai-system-design/rag.md", "options": ["The raw similarity scores, normalized to [0,1]", "Only each document's rank in each list: score = Σ 1/(k + rank)", "A learned weight per retriever", "The LLM's judgment of relevance"], "answer": 1, "explanation": "RRF ignores incomparable raw scores (BM25 vs cosine) and uses ranks, with k ≈ 60 damping the top ranks."}, {"id": "genai-003", "type": "mcq", "question": "Where should document-level access control be enforced in an enterprise RAG system?", "difficulty": 1, "tags": ["rag", "security"], "ref": "04-genai-system-design/rag.md", "options": ["After generation, by scanning the answer for restricted terms", "In the system prompt, telling the model not to reveal restricted content", "Only in the UI layer", "As a security filter inside the retrieval query, using ACLs captured at ingestion"], "answer": 3, "explanation": "Prompts are not a security boundary. If a chunk the user can't see reaches the model, it can leak. Filter at retrieval (pre-filter)."}, {"id": "genai-004", "type": "mcq", "question": "What is the main benefit of a cross-encoder re-ranker over the initial bi-encoder retrieval?", "difficulty": 2, "tags": ["rag", "reranking"], "ref": "04-genai-system-design/rag.md", "options": ["It lets you precompute document vectors for faster search", "It jointly encodes query and document, giving much more accurate relevance scores for the top candidates", "It removes the need for chunking", "It reduces the number of tokens sent to the LLM to zero"], "answer": 1, "explanation": "Cross-encoders see query and doc together (full attention between them) but can't be precomputed, so they're used on the top ~50 results only."}, {"id": "genai-005", "type": "mcq", "question": "You switch to a new embedding model. What must happen to the vector index?", "difficulty": 1, "tags": ["rag", "operations"], "ref": "04-genai-system-design/rag.md", "options": ["Nothing: vectors from different models are compatible", "Normalize the old vectors and keep them", "Re-embed the whole corpus with the new model (e.g. build a new index and cut over blue/green)", "Only re-embed documents added after the switch"], "answer": 2, "explanation": "Embedding spaces from different models aren't comparable. Queries and documents must use the same model."}, {"id": "genai-006", "type": "mcq", "question": "'Lost in the middle' refers to:", "difficulty": 2, "tags": ["rag", "llm"], "ref": "04-genai-system-design/rag.md", "options": ["Chunks being dropped by the vector index during compaction", "LLMs using information at the start and end of a long context better than information in the middle", "Tokens truncated from the middle of a prompt by the API", "Retrieval recall dropping for mid-length documents"], "answer": 1, "explanation": "Order retrieved chunks so the most relevant are first (or at the edges), and keep context focused."}, {"id": "genai-007", "type": "mcq", "question": "What does the 'parent–child' (small-to-big) chunking strategy do?", "difficulty": 2, "tags": ["rag", "chunking"], "ref": "04-genai-system-design/rag.md", "options": ["Embeds small chunks for precise matching but returns the larger parent section to the LLM", "Indexes only document titles", "Uses one embedding per document and one per sentence, averaged", "Splits documents only at the paragraph level"], "answer": 0, "explanation": "Small chunks match precisely; parents give the model enough surrounding context to answer."}, {"id": "genai-008", "type": "mcq", "question": "Which technique rewrites a follow-up like 'what about for contractors?' into a standalone query before retrieval?", "difficulty": 1, "tags": ["rag", "query-understanding"], "ref": "04-genai-system-design/rag.md", "options": ["Reciprocal Rank Fusion", "Speculative decoding", "Conversational query rewriting (condense the question using chat history)", "HyDE"], "answer": 2, "explanation": "Without rewriting, the retriever sees an ambiguous fragment and returns irrelevant chunks."}, {"id": "genai-009", "type": "mcq", "question": "HyDE (Hypothetical Document Embeddings) improves retrieval by:", "difficulty": 3, "tags": ["rag", "query-understanding"], "ref": "04-genai-system-design/rag.md", "options": ["Having the LLM write a hypothetical answer, then embedding that answer to search", "Training the embedding model on user queries", "Generating synthetic documents to add to the index", "Hashing documents to remove duplicates"], "answer": 0, "explanation": "A hypothetical answer often lives closer in embedding space to real answer passages than a short question does."}, {"id": "genai-010", "type": "mcq", "question": "Which vector index is the most common default for low-latency, high-recall ANN search, at the cost of memory?", "difficulty": 1, "tags": ["rag", "vector-search"], "ref": "04-genai-system-design/rag.md", "options": ["B-tree", "HNSW", "LSH with 1 hash table", "Flat (brute force)"], "answer": 1, "explanation": "HNSW is a multi-layer proximity graph: excellent recall/latency, memory-hungry. IVF-PQ trades recall for memory."}, {"id": "genai-011", "type": "mcq", "question": "Why can selective metadata filters (e.g. a tenant with 0.1% of vectors) hurt ANN search quality?", "difficulty": 3, "tags": ["rag", "vector-search"], "ref": "04-genai-system-design/rag.md", "options": ["Filters force exact search over all vectors", "Filters disable cosine similarity", "Filters change the embedding values", "Post-filtering may return too few results, and pre-filtering can break graph connectivity, so recall drops"], "answer": 3, "explanation": "Filtered ANN is a known hard problem; engines use filtered traversal or per-tenant indexes for very selective filters."}, {"id": "genai-012", "type": "mcq", "question": "A 1536-dim float32 embedding is ~6 KB. Roughly how much smaller is it with int8 scalar quantization?", "difficulty": 2, "tags": ["rag", "vector-search", "estimation"], "ref": "04-genai-system-design/rag.md", "options": ["About 4× smaller (~1.5 KB)", "About 2× smaller", "No change; quantization only affects speed", "About 32× smaller"], "answer": 0, "explanation": "float32 = 4 bytes → int8 = 1 byte per dimension. Binary quantization would be 32×."}, {"id": "genai-013", "type": "mcq", "question": "When is long-context prompting a reasonable substitute for RAG?", "difficulty": 2, "tags": ["rag", "trade-offs"], "ref": "04-genai-system-design/rag.md", "options": ["When the corpus is millions of documents", "When permissions vary per document", "Whenever the model supports 1M tokens", "When the relevant material is a few long documents that fit in context and cost/latency are acceptable"], "answer": 3, "explanation": "Long context doesn't fix cost, latency, mid-context recall, or permission enforcement for large corpora."}, {"id": "genai-014", "type": "card", "question": "Name the stages of a RAG ingestion pipeline.", "difficulty": 1, "tags": ["rag"], "ref": "04-genai-system-design/rag.md", "answer": "Connectors (with ACLs + change feeds) → parsing/OCR/layout → chunking (+ contextual headers) → enrichment/metadata → embedding (versioned) → indexing (vector + keyword + filters) → updates/deletes."}, {"id": "genai-015", "type": "card", "question": "List 5 RAG failure modes and a fix for each.", "difficulty": 2, "tags": ["rag"], "ref": "04-genai-system-design/rag.md", "answer": "1) Not retrieved → hybrid search, better chunking, query rewrite. 2) Retrieved but ignored → re-rank, fewer chunks, reorder. 3) Unsupported claims → abstention prompt, grounding check, citations. 4) Stale answers → change feeds, recency boost. 5) Data leakage → ACL filters at retrieval, per-permission cache keys."}, {"id": "genai-016", "type": "card", "question": "How do you evaluate retrieval separately from generation?", "difficulty": 1, "tags": ["rag", "evaluation"], "ref": "04-genai-system-design/rag.md", "answer": "Label a query set with relevant doc/chunk IDs → measure recall@k, MRR, nDCG for retrieval. Then, holding retrieval fixed, judge generation on faithfulness, relevance, correctness, citation accuracy."}, {"id": "genai-017", "type": "card", "question": "What is GraphRAG, and when is it worth it?", "difficulty": 3, "tags": ["rag"], "ref": "04-genai-system-design/rag.md", "answer": "Extract entities and relationships into a knowledge graph, cluster into communities, and pre-summarize them. Retrieval can then answer 'global' questions spanning a corpus (themes, relationships). Expensive to build and refresh; worth it for analysis-heavy corpora where naive chunk retrieval fails."}, {"id": "genai-018", "type": "card", "question": "What is 'contextual chunk headers' / contextual retrieval?", "difficulty": 2, "tags": ["rag", "chunking"], "ref": "04-genai-system-design/rag.md", "answer": "Prepend document title, section path, or an LLM-written summary of where the chunk sits to each chunk before embedding/indexing, so chunks carry their context. Improves retrieval for chunks that are ambiguous on their own."}, {"id": "genai-019", "type": "mcq", "question": "Which phase of LLM inference determines time-to-first-token (TTFT)?", "difficulty": 1, "tags": ["serving"], "ref": "04-genai-system-design/llm-serving.md", "options": ["Decode", "Sampling", "Prefill: processing the whole prompt in parallel", "Detokenization"], "answer": 2, "explanation": "Prefill is compute-bound and scales with prompt length; decode (one token at a time) determines inter-token latency."}, {"id": "genai-020", "type": "mcq", "question": "Decode is typically bound by:", "difficulty": 2, "tags": ["serving"], "ref": "04-genai-system-design/llm-serving.md", "options": ["Disk I/O", "GPU memory bandwidth (reading weights and KV cache for each token)", "Network bandwidth to the client", "Tokenizer speed"], "answer": 1, "explanation": "Each decode step reads all weights plus the KV cache but does little compute per byte, so it's memory-bandwidth-bound; batching helps amortize."}, {"id": "genai-021", "type": "mcq", "question": "What does the KV cache store?", "difficulty": 1, "tags": ["serving"], "ref": "04-genai-system-design/llm-serving.md", "options": ["The key and value vectors of all previous tokens at every attention layer", "Cached complete responses for repeated prompts", "The final hidden state of the last token only", "The vocabulary embedding table"], "answer": 0, "explanation": "It avoids recomputing K/V for past tokens on every decode step. Its size grows with layers × KV heads × head dim × sequence length × batch."}, {"id": "genai-022", "type": "mcq", "question": "Grouped-query attention (GQA) primarily reduces:", "difficulty": 2, "tags": ["serving", "transformers"], "ref": "04-genai-system-design/llm-serving.md", "options": ["The number of transformer layers", "Vocabulary size", "The size of the KV cache (and memory bandwidth during decode)", "Training data requirements"], "answer": 2, "explanation": "Groups of query heads share one K/V head, shrinking the cache vs multi-head attention while keeping quality close."}, {"id": "genai-023", "type": "mcq", "question": "What problem does PagedAttention (vLLM) solve?", "difficulty": 2, "tags": ["serving"], "ref": "04-genai-system-design/llm-serving.md", "options": ["Model weight loading time", "Slow tokenization", "Attention's O(n²) compute", "KV-cache memory fragmentation, by allocating the cache in fixed-size blocks like OS pages"], "answer": 3, "explanation": "Contiguous per-sequence allocation wastes memory; paging allows more concurrent sequences and cache sharing."}, {"id": "genai-024", "type": "mcq", "question": "Continuous (in-flight) batching improves throughput by:", "difficulty": 1, "tags": ["serving"], "ref": "04-genai-system-design/llm-serving.md", "options": ["Batching only requests with the same output length", "Adding and removing sequences from the batch at every decode step", "Running prefill and decode on separate datacenters", "Waiting until a batch of identical prompts is collected"], "answer": 1, "explanation": "Static batching wastes GPU time waiting for the longest sequence; continuous batching keeps the GPU full."}, {"id": "genai-025", "type": "mcq", "question": "Speculative decoding speeds up generation by:", "difficulty": 2, "tags": ["serving"], "ref": "04-genai-system-design/llm-serving.md", "options": ["Having a small draft model propose several tokens that the large model verifies in one forward pass", "Sampling at temperature 0", "Skipping every other layer of the model", "Caching responses to common prompts"], "answer": 0, "explanation": "Accepted tokens come 'for free'; with proper verification the output distribution matches the large model's."}, {"id": "genai-026", "type": "mcq", "question": "To maximize prefix (prompt) caching benefits, you should:", "difficulty": 1, "tags": ["serving", "cost"], "ref": "04-genai-system-design/llm-serving.md", "options": ["Put the user's question first", "Randomize the order of few-shot examples each call", "Put stable content (system prompt, tools, few-shot examples, long docs) at the start of the prompt", "Add a timestamp to the top of the system prompt"], "answer": 2, "explanation": "Caches match on an exact prefix. Anything that varies early (timestamps, user text) breaks the cache for everything after it."}, {"id": "genai-027", "type": "mcq", "question": "Your LLM feature's cost is too high. Which lever usually has the biggest impact?", "difficulty": 1, "tags": ["serving", "cost"], "ref": "04-genai-system-design/llm-serving.md", "options": ["Lower the temperature", "Increase the number of replicas", "Reduce tokens: smaller retrieved context, shorter outputs, routing easy requests to a cheaper model, caching", "Switch from SSE to WebSockets"], "answer": 2, "explanation": "Cost scales with input/output tokens × price per token. Output tokens are typically the most expensive."}, {"id": "genai-028", "type": "mcq", "question": "Hosted LLM API rate limits are typically expressed in:", "difficulty": 1, "tags": ["serving", "operations"], "ref": "04-genai-system-design/llm-serving.md", "options": ["Bytes per second", "GPU-hours per day", "Tokens per minute (TPM) and requests per minute (RPM)", "Concurrent TCP connections"], "answer": 2, "explanation": "Plan capacity in tokens, spread load across deployments/regions, and handle 429s with backoff."}, {"id": "genai-029", "type": "mcq", "question": "Which quantization statement is most accurate?", "difficulty": 2, "tags": ["serving"], "ref": "04-genai-system-design/llm-serving.md", "options": ["INT8/INT4 weight quantization cuts memory and speeds decode with a small, task-dependent quality loss you must measure", "Quantization only affects training, not inference", "Quantization increases the KV cache size", "INT4 is always lossless"], "answer": 0, "explanation": "Methods like GPTQ/AWQ make INT4 viable; always re-run your evals."}, {"id": "genai-030", "type": "card", "question": "Write the formula for KV-cache memory per token.", "difficulty": 3, "tags": ["serving", "estimation"], "ref": "04-genai-system-design/llm-serving.md", "answer": "2 (K and V) × layers × KV heads × head_dim × bytes per value. E.g. 80 layers × 8 KV heads × 128 × 2 bytes × 2 ≈ 320 KB/token for a 70B-class GQA model in fp16."}, {"id": "genai-031", "type": "card", "question": "Self-host open-weights vs hosted API: give 3 reasons for each.", "difficulty": 2, "tags": ["serving", "trade-offs"], "ref": "04-genai-system-design/llm-serving.md", "answer": "Self-host: data stays in your VPC, fine-tuning/control, cheaper at high steady utilization, no vendor rate limits. API: frontier quality, no GPU ops, elastic capacity, fastest iteration. Hybrid is common: API for hard tasks, self-hosted small models for high-volume simple ones."}, {"id": "genai-032", "type": "card", "question": "What does an LLM gateway do?", "difficulty": 2, "tags": ["serving", "platform"], "ref": "04-genai-system-design/llm-serving.md", "answer": "Single entry point for model calls: auth, per-tenant quotas/budgets (TPM, $), routing across models/regions, fallbacks/retries, caching (exact + semantic), PII redaction, prompt registry, logging/tracing, usage metering/chargeback, eval hooks."}, {"id": "genai-033", "type": "mcq", "question": "According to common guidance (e.g. Anthropic's 'Building effective agents'), what's the difference between a workflow and an agent?", "difficulty": 1, "tags": ["agents"], "ref": "04-genai-system-design/agents.md", "options": ["Agents never call tools; workflows do", "Workflows follow predefined code paths; agents let the LLM dynamically decide steps and tool use", "There is no meaningful difference", "Workflows use smaller models; agents use larger ones"], "answer": 1, "explanation": "Prefer workflows for predictability and add agentic autonomy only where the task requires it."}, {"id": "genai-034", "type": "mcq", "question": "An agent can issue refunds. Which design is safest?", "difficulty": 1, "tags": ["agents", "safety"], "ref": "04-genai-system-design/agents.md", "options": ["Give the agent an admin service account so it never fails", "Allow refunds only if the model is very confident", "The tool executes with the customer's scoped identity, is idempotent, enforces a policy limit, and requires human approval above a threshold", "Let the model decide whether approval is needed"], "answer": 2, "explanation": "Deterministic code enforces permissions and limits; the model only proposes."}, {"id": "genai-035", "type": "mcq", "question": "Indirect prompt injection is best described as:", "difficulty": 1, "tags": ["agents", "safety"], "ref": "04-genai-system-design/safety-and-guardrails.md", "options": ["A bug in the tokenizer", "A user typing 'ignore previous instructions'", "Injecting SQL through a chat box", "Malicious instructions embedded in content the system retrieves or receives from tools (web pages, emails, docs)"], "answer": 3, "explanation": "Treat retrieved/tool content as untrusted data that can never grant permissions or change instructions."}, {"id": "genai-036", "type": "mcq", "question": "What is MCP (Model Context Protocol)?", "difficulty": 1, "tags": ["agents"], "ref": "04-genai-system-design/agents.md", "options": ["A proprietary fine-tuning API", "An open protocol for exposing tools, resources, and prompts to LLM applications in a standard way", "A GPU scheduling protocol", "A tokenizer format"], "answer": 1, "explanation": "Write a tool server once and reuse it across compatible clients/agents. (A2A-style protocols address agent-to-agent communication.)"}, {"id": "genai-037", "type": "mcq", "question": "Which is NOT a recommended practice for agent tool design?", "difficulty": 1, "tags": ["agents"], "ref": "04-genai-system-design/agents.md", "options": ["Return actionable error messages", "Make side-effecting tools idempotent", "Use typed JSON schemas with clear descriptions", "Return the full raw API payload (tens of thousands of tokens) so the model has everything"], "answer": 3, "explanation": "Huge outputs waste context, cost, and attention. Paginate and summarize."}, {"id": "genai-038", "type": "mcq", "question": "ReAct refers to:", "difficulty": 1, "tags": ["agents"], "ref": "04-genai-system-design/agents.md", "options": ["Re-ranking retrieved documents", "Reinforcement learning from human feedback", "Interleaving reasoning steps with actions (tool calls) and observations in a loop", "A JavaScript UI framework for chat apps"], "answer": 2, "explanation": "Thought → Action → Observation, repeated until the task is done."}, {"id": "genai-039", "type": "mcq", "question": "When is a multi-agent design justified over a single agent?", "difficulty": 2, "tags": ["agents", "trade-offs"], "ref": "04-genai-system-design/agents.md", "options": ["When the task has only one step", "When you want to reduce token costs", "When subtasks need different tools/prompts/contexts, can run in parallel, or a single context would get too large", "Always: more agents means higher quality"], "answer": 2, "explanation": "Multi-agent adds tokens, coordination failures, and debugging difficulty. Justify it."}, {"id": "genai-040", "type": "card", "question": "List 6 reliability controls for production agents.", "difficulty": 2, "tags": ["agents"], "ref": "04-genai-system-design/agents.md", "answer": "Max steps/turns, token/$ budgets, timeouts, loop detection, schema-validated tool args, idempotency keys, least-privilege delegated auth, human approval for high-impact actions, sandboxed code execution, full tracing."}, {"id": "genai-041", "type": "card", "question": "How do you evaluate an agent?", "difficulty": 2, "tags": ["agents", "evaluation"], "ref": "04-genai-system-design/agents.md", "answer": "Scenario suites with simulated users/tools: task success rate, steps and cost per success, tool-call accuracy (right tool, valid args), recovery from tool errors, harmful-action rate; trajectory reviews; every production failure becomes a regression test. Benchmarks for reference: SWE-bench Verified, τ-bench, GAIA, WebArena."}, {"id": "genai-042", "type": "card", "question": "Short-term vs long-term memory in agents?", "difficulty": 2, "tags": ["agents"], "ref": "04-genai-system-design/agents.md", "answer": "Short-term: the conversation/working context (windowed or summarized), plus an explicit task-state object. Long-term: persisted facts/preferences retrieved like RAG, with write policies, privacy controls, and deletion."}, {"id": "genai-043", "type": "mcq", "question": "Which LLM-as-judge setup is generally the most reliable?", "difficulty": 1, "tags": ["evaluation"], "ref": "04-genai-system-design/evaluation.md", "options": ["Letting the judge see which output is from the new model", "Using the same model as the system under test, unvalidated", "Absolute 1–10 scores with no rubric", "Pairwise comparison with randomized order and a specific rubric, validated against human labels"], "answer": 3, "explanation": "Judges have position, verbosity, and self-preference biases; calibrate with human agreement before trusting them."}, {"id": "genai-044", "type": "mcq", "question": "Faithfulness (groundedness) measures:", "difficulty": 1, "tags": ["evaluation", "rag"], "ref": "04-genai-system-design/evaluation.md", "options": ["How fast the answer streamed", "Whether the answer matches the user's tone", "Whether retrieval found all relevant docs", "Whether every claim in the answer is supported by the retrieved context"], "answer": 3, "explanation": "An answer can be correct but unfaithful (from parametric memory) or faithful to wrong context, so measure both."}, {"id": "genai-045", "type": "mcq", "question": "A prompt change improved your golden-set score from 82% to 84% on 50 examples. Ship it?", "difficulty": 2, "tags": ["evaluation"], "ref": "04-genai-system-design/evaluation.md", "options": ["No, prompt changes should never be shipped", "Not on that alone: 2 points on 50 items is within noise; check confidence intervals, more data, and per-slice regressions", "Yes, as long as latency didn't change", "Yes, any improvement should ship"], "answer": 1, "explanation": "1 item = 2 points here. Use larger sets, paired comparisons, and slice analysis."}, {"id": "genai-046", "type": "mcq", "question": "Which change does NOT need to go through the LLM eval gate?", "difficulty": 1, "tags": ["evaluation"], "ref": "04-genai-system-design/evaluation.md", "options": ["Changing the color of the chat bubble", "Upgrading the model version", "Updating the system prompt", "Changing the chunk size"], "answer": 0, "explanation": "Prompts, models, retrieval config, and tool schemas all change behavior and can regress quality."}, {"id": "genai-047", "type": "mcq", "question": "Which benchmark pair is generally considered saturated for frontier models (less useful for differentiation)?", "difficulty": 2, "tags": ["evaluation"], "ref": "04-genai-system-design/evaluation.md", "options": ["SWE-bench Verified and GPQA", "τ-bench and GAIA", "MMLU and HumanEval", "LiveCodeBench and MMLU-Pro"], "answer": 2, "explanation": "Harder/more realistic benchmarks have replaced them for frontier comparisons. Still, build evals on your own task."}, {"id": "genai-048", "type": "card", "question": "How do you build a golden dataset for an LLM feature?", "difficulty": 1, "tags": ["evaluation"], "ref": "04-genai-system-design/evaluation.md", "answer": "Sample 50–200 real (de-identified) inputs, stratified by intent/difficulty/language/risk; add adversarial cases (unanswerable, injection, out-of-scope); expert labels with reference answers or rubrics plus expected sources; version it; keep a held-out slice; add every production failure."}, {"id": "genai-049", "type": "card", "question": "Name 5 online signals for an LLM assistant.", "difficulty": 1, "tags": ["evaluation"], "ref": "04-genai-system-design/evaluation.md", "answer": "Thumbs up/down, reformulation/retry rate, copy events, escalation-to-human rate, task completion/deflection, session abandonment; guardrails: latency (TTFT, p95), cost/request, safety-flag rate."}, {"id": "genai-050", "type": "mcq", "question": "Your assistant needs knowledge of policy documents that change weekly. Best approach?", "difficulty": 1, "tags": ["fine-tuning", "rag"], "ref": "04-genai-system-design/fine-tuning-and-alignment.md", "options": ["Increase temperature", "RAG over the policy documents", "Fine-tune the model weekly on the documents", "Pre-train a model from scratch"], "answer": 1, "explanation": "RAG handles changing knowledge, supports citations, and is cheap to update. Fine-tuning is for behavior/format."}, {"id": "genai-051", "type": "mcq", "question": "LoRA works by:", "difficulty": 1, "tags": ["fine-tuning"], "ref": "04-genai-system-design/fine-tuning-and-alignment.md", "options": ["Training only the embedding layer", "Quantizing the model to 4 bits", "Freezing base weights and training small low-rank matrices whose product is added to selected weight matrices", "Pruning 90% of the model's weights"], "answer": 2, "explanation": "ΔW = B·A with rank r ≪ d: few trainable params, swappable adapters. QLoRA adds a 4-bit quantized base."}, {"id": "genai-052", "type": "mcq", "question": "DPO differs from classic RLHF in that it:", "difficulty": 2, "tags": ["fine-tuning", "alignment"], "ref": "04-genai-system-design/fine-tuning-and-alignment.md", "options": ["Uses unit tests as rewards", "Optimizes the policy directly on preference pairs, without training a separate reward model or running PPO", "Requires no preference data", "Only works for image models"], "answer": 1, "explanation": "Simpler and more stable; widely used. RL with verifiable rewards (e.g. tests, math answers) is used for reasoning models."}, {"id": "genai-053", "type": "mcq", "question": "Which is the strongest signal that fine-tuning is worth it?", "difficulty": 2, "tags": ["fine-tuning"], "ref": "04-genai-system-design/fine-tuning-and-alignment.md", "options": ["Users want citations", "A prompted base model + RAG still misses a consistent output format/style on a high-volume narrow task, and you have ~1K quality examples", "The model doesn't know yesterday's news", "You want to reduce hallucinated facts about changing data"], "answer": 1, "explanation": "Fine-tune for behavior and efficiency (distill to a smaller model); use RAG for knowledge."}, {"id": "genai-054", "type": "card", "question": "Give the decision ladder from prompting to pre-training.", "difficulty": 1, "tags": ["fine-tuning"], "ref": "04-genai-system-design/fine-tuning-and-alignment.md", "answer": "1) Prompt engineering (+ few-shot, structured output) → 2) RAG for knowledge gaps → 3) Fine-tuning (LoRA/SFT/DPO) for behavior, format, or a cheaper distilled model → 4) Continued pre-training only for huge domain corpora. Always compare against the cheaper baseline on evals."}, {"id": "genai-055", "type": "mcq", "question": "Which control best prevents a support bot from leaking one customer's data to another?", "difficulty": 1, "tags": ["safety"], "ref": "04-genai-system-design/safety-and-guardrails.md", "options": ["Set temperature to 0", "Use a larger model", "Scope every retrieval and tool call to the authenticated customer's ID in code", "Tell the model in the system prompt never to reveal other customers' data"], "answer": 2, "explanation": "Authorization must be deterministic and outside the model."}, {"id": "genai-056", "type": "mcq", "question": "Rendering raw LLM output directly as HTML in a web app risks:", "difficulty": 1, "tags": ["safety"], "ref": "04-genai-system-design/safety-and-guardrails.md", "options": ["Higher token costs", "Embedding drift", "Cross-site scripting (insecure output handling)", "Prompt caching misses"], "answer": 2, "explanation": "Treat model output as untrusted input to downstream systems: escape, validate, sandbox."}, {"id": "genai-057", "type": "card", "question": "Name 6 items from the OWASP Top 10 for LLM applications.", "difficulty": 2, "tags": ["safety"], "ref": "04-genai-system-design/safety-and-guardrails.md", "answer": "Prompt injection, sensitive information disclosure, supply chain, data and model poisoning, improper output handling, excessive agency, system prompt leakage, vector and embedding weaknesses, misinformation, unbounded consumption."}, {"id": "genai-058", "type": "card", "question": "Sketch a guardrail pipeline.", "difficulty": 2, "tags": ["safety"], "ref": "04-genai-system-design/safety-and-guardrails.md", "answer": "Input: authN/authZ → rate/budget limits → PII redaction → injection/policy classifier. Orchestration: tools run with the user's permissions. Output: schema validation → groundedness check → content safety → PII/DLP scan. Run checks in parallel where possible to limit latency."}, {"id": "genai-059", "type": "mcq", "question": "In an LLM system design interview, what's the strongest first move after hearing the prompt?", "difficulty": 1, "tags": ["framework"], "ref": "04-genai-system-design/framework.md", "options": ["Start writing the system prompt", "Pick the largest available model", "Draw the vector database", "Clarify users, success metrics, data/permissions, actions, risk level, scale, and latency/cost constraints"], "answer": 3, "explanation": "Staff candidates scope and define success before drawing boxes."}, {"id": "genai-060", "type": "mcq", "question": "A user asks for an AI feature. The task is routing 5 well-defined request types to forms. Best answer?", "difficulty": 2, "tags": ["framework", "trade-offs"], "ref": "04-genai-system-design/framework.md", "options": ["Fine-tune a 70B model", "Build a multi-agent system with a planner", "Use RAG over the forms", "A small classifier or even rules may be enough; use an LLM only if the inputs are too varied, and measure against that baseline"], "answer": 3, "explanation": "Knowing when NOT to use an LLM is a Staff signal."}, {"id": "genai-061", "type": "card", "question": "What 5 things do Staff candidates cover in LLM designs that others skip?", "difficulty": 1, "tags": ["framework"], "ref": "04-genai-system-design/framework.md", "answer": "1) Evaluation design and release gates. 2) Permission-aware retrieval/tools. 3) Cost per request and latency budget (TTFT, routing, caching). 4) Failure handling and fallbacks. 5) Rollout: shadow → A/B → ramp, with versioned prompts/models/indexes and rollback."}, {"id": "genai-062", "type": "card", "question": "Draw (describe) the request path of a production RAG assistant.", "difficulty": 1, "tags": ["framework", "rag"], "ref": "04-genai-system-design/framework.md", "answer": "Client → gateway (auth, rate limit) → orchestrator → input guardrails → query rewrite/route → hybrid retrieval with ACL filter → re-rank → prompt assembly (versioned, token budget) → LLM via model gateway (fallbacks, cache) → output guardrails (grounding, safety) → stream with citations; tracing + feedback + cost metering throughout."}]}, "llm-fundamentals": {"topic": "llm-fundamentals", "title": "Transformers & LLM fundamentals", "questions": [{"id": "llm-fundamentals-001", "type": "mcq", "question": "Why is QKᵀ divided by √d_k in attention?", "difficulty": 1, "tags": ["attention"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["To make attention linear-time", "To keep dot-product magnitudes from growing with dimension, which would saturate softmax and shrink gradients", "To normalize the output vectors to unit length", "To apply the causal mask"], "answer": 1, "explanation": "For unit-variance components, the dot product's variance grows with d_k."}, {"id": "llm-fundamentals-002", "type": "mcq", "question": "Time complexity of full self-attention in sequence length n (hidden size d)?", "difficulty": 1, "tags": ["attention"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["O(n log n)", "O(d²) independent of n", "O(n · d)", "O(n² · d)"], "answer": 3, "explanation": "Every token attends to every token; memory is O(n²) for the attention matrix (FlashAttention avoids materializing it)."}, {"id": "llm-fundamentals-003", "type": "mcq", "question": "A causal mask in decoder attention:", "difficulty": 1, "tags": ["attention"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Randomly drops attention heads", "Hides padding tokens only", "Removes the first token", "Prevents each position from attending to future positions"], "answer": 3, "explanation": "Set scores for j > i to −∞ before softmax."}, {"id": "llm-fundamentals-004", "type": "mcq", "question": "Why do transformers need positional information?", "difficulty": 1, "tags": ["positional"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Self-attention is permutation-invariant; without positions, word order is invisible", "To speed up tokenization", "Only for encoder models", "To reduce memory"], "answer": 0, "explanation": "Sinusoidal, learned, RoPE, or ALiBi add order information."}, {"id": "llm-fundamentals-005", "type": "mcq", "question": "RoPE encodes position by:", "difficulty": 2, "tags": ["positional"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Multiplying values by the position", "Appending the position index as a token", "Adding a learned vector to each token embedding", "Rotating query and key vectors by position-dependent angles so their dot product depends on relative position"], "answer": 3, "explanation": "Used by Llama, Qwen, Mistral; extendable with scaling methods (NTK, YaRN)."}, {"id": "llm-fundamentals-006", "type": "mcq", "question": "Which architecture family dominates today's general-purpose LLMs?", "difficulty": 1, "tags": ["architecture"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["CNNs", "Decoder-only transformers", "Encoder-only (BERT-style)", "RNNs"], "answer": 1, "explanation": "Encoder-only models remain strong for embeddings and classification."}, {"id": "llm-fundamentals-007", "type": "mcq", "question": "Temperature T in sampling:", "difficulty": 1, "tags": ["decoding"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Controls the context length", "Divides logits by T before softmax: T < 1 sharpens the distribution, T > 1 flattens it", "Selects the top-T tokens", "Limits the number of output tokens"], "answer": 1, "explanation": "T → 0 approaches greedy decoding."}, {"id": "llm-fundamentals-008", "type": "mcq", "question": "Top-p (nucleus) sampling:", "difficulty": 1, "tags": ["decoding"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Repeats the prompt p times", "Samples from the smallest set of tokens whose cumulative probability ≥ p", "Samples only tokens with probability ≥ p", "Always picks the p most likely tokens"], "answer": 1, "explanation": "The candidate set adapts to how peaked the distribution is."}, {"id": "llm-fundamentals-009", "type": "mcq", "question": "Chinchilla scaling suggests compute-optimal training uses roughly:", "difficulty": 2, "tags": ["scaling"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["~1,000 tokens per parameter", "~1 token per parameter", "As few tokens as possible", "~20 training tokens per parameter"], "answer": 3, "explanation": "Production models often train far longer than this because smaller models are cheaper at inference."}, {"id": "llm-fundamentals-010", "type": "mcq", "question": "Approximate training compute for a dense transformer with N parameters on D tokens?", "difficulty": 3, "tags": ["scaling"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["≈ N² FLOPs", "≈ N·D FLOPs", "≈ 6·N·D FLOPs", "≈ 2·N FLOPs total"], "answer": 2, "explanation": "2ND forward + 4ND backward. Inference ≈ 2N FLOPs per token."}, {"id": "llm-fundamentals-011", "type": "mcq", "question": "Why are LLMs often bad at counting letters in a word?", "difficulty": 1, "tags": ["tokenization"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["They see subword tokens, not individual characters", "Attention can't count", "Temperature is too high", "They have no training data about spelling"], "answer": 0, "explanation": "'strawberry' may be 2–3 tokens; character structure is only indirectly learned."}, {"id": "llm-fundamentals-012", "type": "mcq", "question": "What does RLHF add after SFT?", "difficulty": 2, "tags": ["alignment"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Optimizing the model against a reward model trained on human preference comparisons (e.g. with PPO and a KL penalty)", "More pre-training data", "A larger vocabulary", "A retrieval index"], "answer": 0, "explanation": "The KL term keeps the policy close to the SFT model to avoid reward hacking."}, {"id": "llm-fundamentals-013", "type": "mcq", "question": "'Reasoning models' are commonly trained with:", "difficulty": 2, "tags": ["alignment"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Reinforcement learning on verifiable rewards (e.g. correct math answers, passing unit tests)", "Smaller vocabularies", "Only more pre-training data", "No fine-tuning at all"], "answer": 0, "explanation": "This produces long chains of thought; prompting them needs clear goals more than 'think step by step'."}, {"id": "llm-fundamentals-014", "type": "mcq", "question": "An encoder-only model like BERT is pre-trained with:", "difficulty": 2, "tags": ["architecture"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Next-token prediction only", "Masked language modeling (predict masked tokens from both sides)", "Reinforcement learning", "Contrastive image–text loss"], "answer": 1, "explanation": "Bidirectional context makes it good for classification and embeddings, not open-ended generation."}, {"id": "llm-fundamentals-015", "type": "mcq", "question": "Which best reduces hallucination in a production Q&A assistant?", "difficulty": 1, "tags": ["hallucination"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Removing the system prompt", "Raising temperature", "Longer system prompts with more adjectives", "RAG with citations, explicit permission to say 'I don't know', and a grounding check"], "answer": 3, "explanation": "Combine retrieval, abstention, and verification; measure faithfulness."}, {"id": "llm-fundamentals-016", "type": "mcq", "question": "Why does a low-rank (LoRA) update work well for fine-tuning?", "difficulty": 3, "tags": ["fine-tuning"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Because LLM weights are already low-rank", "Task-specific weight changes tend to have low intrinsic rank, so a small B·A captures most of the adaptation", "Because it trains the whole model faster", "It only works for classification"], "answer": 1, "explanation": "Few trainable parameters, little forgetting, swappable adapters."}, {"id": "llm-fundamentals-017", "type": "mcq", "question": "CLIP is trained by:", "difficulty": 2, "tags": ["multimodal"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Contrastively aligning image and text embeddings from paired data", "Generating captions with a decoder only", "Masked image modeling only", "Supervised ImageNet labels"], "answer": 0, "explanation": "Enables zero-shot classification and text-to-image retrieval."}, {"id": "llm-fundamentals-018", "type": "mcq", "question": "Matryoshka embeddings let you:", "difficulty": 3, "tags": ["embeddings"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["Embed images and text together", "Truncate an embedding to fewer dimensions with modest quality loss", "Store embeddings without floating point", "Skip normalization"], "answer": 1, "explanation": "Useful for cheaper first-pass retrieval with a full-dimension re-score."}, {"id": "llm-fundamentals-019", "type": "mcq", "question": "Pre-norm transformer blocks (norm inside the residual branch, before attention/MLP) are preferred because:", "difficulty": 3, "tags": ["architecture"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "options": ["They train more stably for deep networks", "They remove the need for residual connections", "They make attention linear", "They use less memory"], "answer": 0, "explanation": "Post-norm (the original) needs careful warmup and is harder to train deep."}, {"id": "llm-fundamentals-020", "type": "card", "question": "Write the attention equation and explain it in one sentence.", "difficulty": 1, "tags": ["attention"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "answer": "Attention(Q,K,V) = softmax(QKᵀ/√d_k)·V. Each token's output is a weighted average of value vectors, weighted by how well its query matches each key."}, {"id": "llm-fundamentals-021", "type": "card", "question": "List the stages of building a chat LLM.", "difficulty": 1, "tags": ["training"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "answer": "Pre-training (next-token prediction on trillions of tokens) → optional mid-training/continued pre-training (domain, long context) → SFT on instructions → preference tuning (RLHF/DPO/RLAIF) → often RL with verifiable rewards for reasoning → safety tuning and evals."}, {"id": "llm-fundamentals-022", "type": "card", "question": "Multi-head vs multi-query vs grouped-query attention?", "difficulty": 2, "tags": ["attention"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "answer": "MHA: each head has its own Q, K, V. MQA: all heads share one K/V (smallest KV cache, some quality loss). GQA: groups of query heads share K/V (a middle ground; standard in modern LLMs)."}, {"id": "llm-fundamentals-023", "type": "card", "question": "Why doesn't a 1M-token context window make RAG obsolete?", "difficulty": 2, "tags": ["rag"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "answer": "Cost and latency scale with tokens; recall degrades for information in the middle of long contexts; permissions still need enforcing per user; corpora are often far larger than any window; freshness and citations are easier with retrieval."}, {"id": "llm-fundamentals-024", "type": "card", "question": "Name 5 prompting techniques that reliably help.", "difficulty": 1, "tags": ["prompting"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "answer": "Clear task + constraints + output format; role/context; few-shot examples; delimiters around untrusted content; step-by-step reasoning (or using a reasoning model); decomposition into sub-prompts; self-consistency; structured output schemas; stable prefix first for caching."}, {"id": "llm-fundamentals-025", "type": "card", "question": "What is BPE tokenization?", "difficulty": 2, "tags": ["tokenization"], "ref": "05-ml-fundamentals/transformers-and-llms.md", "answer": "Byte-Pair Encoding: start from characters/bytes and repeatedly merge the most frequent adjacent pair into a new token, building a subword vocabulary. Balances vocabulary size against sequence length; byte-level BPE can encode any string."}]}, "ml-fundamentals": {"topic": "ml-fundamentals
